# DIE PRUEFUNG, DIE NIEMAND VERGESSEN KANN
#
# Der Anlass ist ein Befund vom 21.09.2026 und keine Vorsichtsmassnahme: `main` war zwei
# Tage lang rot, und es ist niemandem aufgefallen. Die HomeStation hatte vierzehn
# Auftraege beantwortet und direkt nach `main` geschoben; dabei entstanden Luecken in der
# Rangfolge der offenen Auftraege. Der Waechter dafuer meldete das sofort — nur fuhr ihn
# niemand.
#
#     Ein Waechter, der meldet, wo niemand hinsieht, hat dieselbe Wirkung wie keiner.
#
# Diese Datei ist die fehlende Stelle: Sie faehrt die Proben bei JEDEM Schieben, und wenn
# etwas rot ist, schickt GitHub demjenigen eine Nachricht, der geschoben hat. Es gibt
# danach keinen Zustand mehr, in dem der Hauptzweig kaputt ist und es keiner weiss.
#
# WAS HIER BEWUSST NICHT STEHT
#
# Kein `ruff` und kein anderer Stilpruefer. Gemessen am 21.09.2026: Mit den Vorgaberegeln
# meldet `ruff` 108 Befunde an einem Bestand, der diese Regeln nie uebernommen hat. Ein
# Tor, das vom ersten Tag an rot ist, bringt niemandem etwas bei — es bringt allen bei,
# rote Tore zu uebersehen. Die 108 Befunde sind als eigener Posten notiert, nicht als
# Torwaechter eingesetzt.
#
# Keine GPU, kein Blender, kein `.venv-ifc`. Die Proben laufen ohne all das — 45 von
# ihnen melden sich dann als uebersprungen, und genau das ist der Beleg dafuer, dass der
# Kern eine Bibliothek ist (Regel 4). Waere hier Blender noetig, waere die Regel verletzt.

name: Proben

on:
  push:
    branches: ["**"]
  pull_request:
  # Von Hand ausloesbar — fuer den Fall, dass jemand wissen will, ob der Stand haelt,
  # ohne dafuer etwas schieben zu muessen.
  workflow_dispatch:

# Ein zweites Schieben auf denselben Zweig loest den vorigen Lauf ab. Ohne das stauen
# sich Laeufe, deren Ergebnis niemanden mehr interessiert, und der interessante steht
# dahinter in der Schlange.
concurrency:
  group: proben-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  proben:
    name: Proben ohne GPU, ohne Blender
    runs-on: ubuntu-latest
    # GESETZT, nicht gemessen: Der ganze Lauf dauert hier rund zwei Minuten. Fuenfzehn
    # geben Luft fuer eine langsamere Maschine und schneiden einen haengenden Lauf ab,
    # statt ihn sechs Stunden stehen zu lassen (die Vorgabe von GitHub).
    timeout-minutes: 15

    steps:
      - name: Stand holen
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          # Die Fassung, gegen die dieses Projekt seine Zahlen misst. `pyproject.toml`
          # laesst >=3.11 zu; hier steht die eine, an der die Zahlen haengen.
          python-version: "3.11"
          cache: pip

      - name: Abhaengigkeiten
        # `.[dev]` und nicht nur `pytest`: numpy und Pillow gehoeren dazu, weil vier
        # Waechter der 16-Bit-Skalierung ohne sie STILLSCHWEIGEND aussetzen. Am
        # 22.08.2026 ist genau das passiert. Ein Waechter, der nur laeuft, wenn zufaellig
        # das richtige Paket da ist, bewacht nichts.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Die Proben
        # DIE STILPROBE IST HIER PFLICHT (21.10.2026): `tests/test_stil_probe.py` oeffnet den Bau der
        # Knotenansicht in Chrome (auf ubuntu-latest vorhanden) und misst, ob die Stile greifen. Eine
        # verlorene CSS-Klammer liess Vite, tsc und Vitest gruen und den Mac des Owners ohne Stil.
        # Ohne diesen Schalter wuerde ein fehlendes Chrome die Probe still ueberspringen.
        env:
          AIIMAGING_STILPROBE_PFLICHT: "1"
        # Ohne `-x`: Wir wollen ALLE Fehlschlaege sehen und nicht nur den ersten. Wer
        # beim ersten abbricht, faehrt danach so oft, wie es Fehler gibt.
        # DIE ROTEN PROBEN ALS HINWEIS (14.10.2026): Die Cloud-Sitzung liest nur die Hinweise
        # eines Laufs, nicht sein Protokoll — ohne diese Zeilen hiess Rot dort «exit code 1».
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rf 2>&1 | tee proben.log || {
            grep -E "^(FAILED|ERROR) " proben.log | head -30 | while IFS= read -r z; do echo "::error::${z:0:400}"; done
            exit 1
          }

      - name: Der Einbau-Stand, zum Mitlesen
        # KEIN TOR, sondern eine Auskunft — darum `continue-on-error`. Sie steht hier,
        # weil dieses Werkzeug ohnehin gelesen wird, bevor jemand einen Auftrag schreibt,
        # und weil im Lauf sichtbar sein soll, was gerade bei wem liegt.
        if: always()
        continue-on-error: true
        run: python tools/einbau.py

  knoten:
    name: Knotenansicht - Proben, Typen, Bau gleich eingecheckt
    # A0012 (28.10.2026). Bis dahin liefen die 197 Vitest-Dateien der Kopie nur am Heim-PC;
    # in der Cloud-CI prueften die Python-Proben nur den STEMPEL des Baus. Anlass A0004: Der
    # Stempel war nachgefuehrt, der Bau nicht - `test_knoten_bau` blieb gruen, der Mac sah den
    # alten Stand. Darum baut dieser Job die Knotenansicht neu und vergleicht mit dem Eingecheckten.
    runs-on: ubuntu-latest
    # GESETZT, nicht gemessen: lokal rund 2,5 Minuten (npm ci 10 s, Proben 85 s, Typen 40 s,
    # Bau 25 s); eine kalte Maschine braucht mehr. Zehn ist die Vorgabe des Auftrags.
    timeout-minutes: 10

    steps:
      - name: Stand holen
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: kosmovis/package-lock.json

      - name: Python 3.11 (fuer den Bau-Werkzeug-Aufruf, nur Standardbibliothek)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten
        working-directory: kosmovis
        run: npm ci --no-audit --no-fund

      - name: Die Vitest-Proben (alle Pakete und Apps)
        # `npm test` laeuft je Arbeitsbereich im eigenen Ordner; ein `npx vitest run` an der
        # Wurzel faende die Dateien, aber Proben, die relativ zur App lesen, scheiterten.
        working-directory: kosmovis
        run: npm test

      - name: Typen (tsc --noEmit)
        working-directory: kosmovis
        run: npm run typecheck

      - name: Knotenansicht neu bauen
        # Dasselbe Werkzeug wie am Heim-PC: Kopie gegen ihren Abdruck pruefen, vite build,
        # Werkzeugliste schreiben, stempeln.
        run: python tools/knoten_bau.py

      - name: Eingecheckter Bau weicht vom frischen Bau ab?
        # Auch Neues (nicht Eingechecktes) zaehlt: `git status` zeigt beides.
        shell: bash
        run: |
          D=kosmovis/apps/visbox-knoten/dist
          if [ -n "$(git status --porcelain -- "$D")" ]; then
            git status --short -- "$D" | head -40
            echo "::error::Der eingecheckte Bau unter $D weicht vom frischen Bau ab - mit 'python3 tools/knoten_bau.py' neu bauen und einchecken."
            exit 1
          fi
          echo "Bau gleich."
