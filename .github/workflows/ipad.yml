# DIE IPAD-APP WIRD HIER UEBERSETZT, WEIL SIE SONST NIRGENDS UEBERSETZT WIRD
#
# Der Anlass ist ein Umstand und kein Befund: Die App entsteht in einer Umgebung ohne Mac
# (Owner-Entscheid 22.09.2026, Nr. 21/22). Der Kern laesst sich dort unter Linux pruefen,
# die App selbst nicht — SwiftUI und PencilKit gibt es nur bei Apple. Ohne diesen Lauf
# hiesse «gebaut» bei der App: geschrieben und nie einem Uebersetzer vorgelegt.
#
#     Ein Code, den nie ein Uebersetzer gesehen hat, ist ein Entwurf, der wie Code aussieht.
#
# Er faehrt darum ZWEI Dinge, und das zweite ist das, was es sonst nirgends gibt:
#   1. `swift test` im Kern — dieselben Proben wie unter Linux, hier gegen Apples Foundation.
#      Zwei Foundations koennen dasselbe JSON verschieden lesen; das faellt nur auf, wenn
#      beide fahren.
#   2. Die App fuer den iOS-Simulator uebersetzen — ohne Signatur, ohne Geraet.
#
# Seit dem 01.10.2026 (v0.1.7) ein drittes, im eigenen Job `mac`: die Mac-App, gebaut als
# `.app` mit Behelfs-Unterschrift und als ZIP zum Herunterladen abgelegt — der Owner holt sie
# von hier (Entscheid 58). Gestartet ist sie damit noch nicht.
#
# Seit dem 13.10.2026 (v0.2.1, Owner-Entscheid 84) ein viertes, im eigenen Job `freigabe`: Traegt
# `main` eine Nummer, die noch keinen Tag hat, legt er eine GitHub-Freigabe ab (Tag `v<nummer>`;
# Mac-ZIP, iPad-Paket als ZIP, Fassungsblatt, SHA256SUMS.txt). Danach fragen die Apps
# (`Kern/Aktualisierung.swift`). Nur auf `main`, nur bei neuer Nummer (84b), nur wenn `app` und
# `mac` gruen sind.
#
# WAS HIER BEWUSST NICHT STEHT
#
# Kein Aufspielen, keine Signatur mit Apple-Konto (die Mac-App traegt nur die Behelfs-
# Unterschrift, ohne die ein Mac mit Apple-Chip nichts startet), kein Simulatorlauf mit
# Klicks. Ob die App auf dem iPad startet, zeichnet und die HomeStation findet, und ob die
# Mac-App die Leitung nach Hause aufbaut, zeigt nur das Geraet — bis dahin heisst
# sie im Einbau-Stand «gebaut, am Geraet unbestaetigt». Und ob Swift Playgrounds auf dem
# iPad das Paket oeffnet, kann kein Mac-Lauf beantworten.
#
# Seit dem 20.10.2026 («Visbox eigenstaendig», Schritt 1) auch bei einem neuen Bau der
# Knotenansicht (`kosmovis/apps/visbox-knoten/dist/`): Er liegt jetzt IM Mac-Buendel, und ein
# neuer Bau ohne neuen Lauf hiesse eine Mac-App mit dem alten.
#
# Nur bei Aenderungen unter `ipad/` oder an dieser Datei: Ein Mac-Lauf kostet ein
# Vielfaches eines Linux-Laufs, und eine Aenderung am Python-Kern aendert an der App nichts
# (die Uebereinstimmung der Wege bewacht `tests/test_ipad_geruest.py` im Linux-Lauf).

name: iPad

on:
  push:
    branches: ["**"]
    paths:
      - "ipad/**"
      - "kosmovis/apps/visbox-knoten/dist/**"
      - ".github/workflows/ipad.yml"
  pull_request:
    paths:
      - "ipad/**"
      - "kosmovis/apps/visbox-knoten/dist/**"
      - ".github/workflows/ipad.yml"
  workflow_dispatch:

concurrency:
  group: ipad-${{ github.ref }}
  cancel-in-progress: true

# NUR LESEN, fuer jeden Job — ausser `freigabe`, der als einziger schreiben darf (er legt Tag
# und Freigabe an). Die Schreibrechte stehen darum an ihm und nicht hier: Ein Fehler in einem
# Uebersetzungsschritt soll nichts im Repo anlegen koennen.
permissions:
  contents: read

jobs:
  app:
    name: Kern pruefen, App uebersetzen
    # EINE FESTE FASSUNG statt `macos-latest`: Wechselt GitHub die Vorgabe, wechselt mit
    # ihr Xcode — und ein roter Lauf saehe dann aus wie ein Fehler in unserem Code.
    runs-on: macos-15
    # GESETZT, nicht gemessen: Ein erster Lauf mit leerem Zwischenspeicher braucht fuer
    # Paketaufloesung und Uebersetzung einige Minuten. Dreissig schneiden einen haengenden
    # Simulator ab, statt ihn sechs Stunden stehen zu lassen.
    timeout-minutes: 30

    steps:
      - name: Stand holen
        uses: actions/checkout@v4

      - name: Fassungen, zum Mitlesen
        # Ohne diese Zeile laesst sich ein roter Lauf in drei Monaten nicht mehr einer
        # Xcode-Fassung zuordnen.
        run: |
          xcodebuild -version
          swift --version

      - name: Der Kern (swift test)
        working-directory: ipad/VisboxKern
        run: swift test

      - name: Welche Schemata Xcode im App-Paket sieht
        # EINE AUSKUNFT, KEIN TOR. Faellt der naechste Schritt, steht hier, unter welchem
        # Namen Xcode die App fuehrt.
        if: always()
        continue-on-error: true
        working-directory: ipad/Visbox.swiftpm
        run: xcodebuild -list

      - name: Die App fuer den iOS-Simulator
        # Im Paketordner selbst: `xcodebuild` liest dann `Package.swift` samt
        # `AppleProductTypes`, wie Xcode es beim Oeffnen des `.swiftpm` tut. Ein
        # gewoehnliches `swift build` kennt `AppleProductTypes` nicht.
        working-directory: ipad/Visbox.swiftpm
        run: |
          xcodebuild build \
            -scheme Visbox \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO

      - name: Liegt das Icon in der App? (Auskunft)
        # OWNER-BEFUND 20.10.2026: Die iPad-App zeigt kein Icon, obwohl `appIcon: .asset("AppIcon")`
        # im Paket steht (Entscheid 88). KEIN TOR, eine Auskunft: Steht `CFBundleIcons` in der
        # Info.plist des gebauten Buendels, und liegt das Icon im HAUPTbuendel (Assets.car, AppIcon*.png)
        # — oder nur im Ressourcenbuendel des Moduls, wo iPadOS es nicht sucht?
        if: always()
        continue-on-error: true
        working-directory: ipad/Visbox.swiftpm
        run: |
          APP=$(find build/dd/Build/Products -name 'Visbox.app' -maxdepth 3 | head -1)
          echo "Buendel: $APP"
          ls -la "$APP" | head -50
          echo "--- CFBundleIcons / CFBundleIconName:"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons' "$APP/Info.plist" || echo "KEIN CFBundleIcons"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons~ipad' "$APP/Info.plist" || echo "KEIN CFBundleIcons~ipad"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$APP/Info.plist" || echo "KEIN CFBundleIconName"
          echo "--- Assets.car im Hauptbuendel:"; ls -la "$APP/Assets.car" || echo "KEIN Assets.car"
          echo "--- AppIcon-Dateien:"; find "$APP" -iname 'AppIcon*' | head -20
          echo "--- Ressourcenbuendel:"; find "$APP" -name '*.bundle' -maxdepth 2 | while read b; do echo "$b"; ls "$b" | head -20; done
          # OWNER-BEFUND 20.10.2026 (Naehe): Am Geraet kam ueber die Naehe nichts an. Stehen die
          # Schluessel fuer Lokales Netzwerk, Bonjour und Kamera so im GEBAUTEN Buendel, wie
          # MultipeerConnectivity sie braucht (`_visbox-kopp._tcp` und `_visbox-kopp._udp`)? Die
          # Playgrounds-Form `.localNetwork(bonjourServiceTypes:)` koennte sie anders schreiben.
          echo "--- NSLocalNetworkUsageDescription:"
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$APP/Info.plist" || echo "KEIN NSLocalNetworkUsageDescription"
          echo "--- NSBonjourServices:"
          /usr/libexec/PlistBuddy -c 'Print :NSBonjourServices' "$APP/Info.plist" || echo "KEIN NSBonjourServices"
          echo "--- NSCameraUsageDescription:"
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$APP/Info.plist" || echo "KEIN NSCameraUsageDescription"

  mac:
    name: Mac-App bauen, als ZIP ablegen
    # DIE MAC-APP (v0.1.7, Strom A) ist zum HERUNTERLADEN gedacht (Owner-Entscheid 58): Der
    # Owner holt sie als ZIP aus diesem Lauf, ohne Xcode und ohne Apple-Konto. Darum endet
    # dieser Job nicht beim Uebersetzen, sondern bei einem Buendel, das ein Mac oeffnet.
    #
    # Ein eigener Job und nicht ein Schritt mehr in `app`: Faellt die iOS-App, soll die
    # Mac-App trotzdem gebaut werden — und umgekehrt. Zwei Dinge, die nichts voneinander
    # wissen, sollen nicht aneinander scheitern.
    runs-on: macos-15
    # GESETZT, nicht gemessen — dieselbe Ueberlegung wie bei `app`.
    timeout-minutes: 30

    steps:
      - name: Stand holen
        uses: actions/checkout@v4

      - name: Fassungen, zum Mitlesen
        run: |
          xcodebuild -version
          swift --version

      - name: Uebersetzen (nur Apple-Chip)
        # NUR ARM64: Der eine Mac bis zur Abgabe hat einen Apple-Chip (Owner-Entscheid 59).
        # Ein Buendel fuer beide Chips kostete die doppelte Uebersetzung fuer einen Rechner,
        # den es nicht gibt.
        working-directory: ipad/VisboxMac
        # DIE FEHLERZEILEN ALS HINWEIS (14.10.2026): Die Cloud-Sitzung kann das Protokoll eines
        # Laufs nicht lesen, nur seine Hinweise. Ohne diese Zeilen hiess ein roter Lauf dort nur
        # «exit code 1».
        shell: bash
        run: |
          set -o pipefail
          swift build -c release --arch arm64 2>&1 | tee build.log || {
            grep -E "error:" build.log | sort -u | head -20 | while IFS= read -r z; do echo "::error::$z"; done
            exit 1
          }

      - name: Das Buendel zusammensetzen
        # NAME UND PROGRAMM AUS DER PLIST, nicht hier ein zweites Mal: `App/Info.plist` ist
        # gegen `Kern/Marke.swift` bewacht (`tests/test_ipad_geruest.py`), diese Datei nicht.
        #
        # DIE SCHRIFTEN UNVERAENDERT, SAMT LIZENZTEXTEN: Die OFL verlangt, dass der Lizenztext
        # mit der Schrift geht. Kopiert wird der ganze Ordner des iPad-Pakets, nicht eine
        # Auswahl — dieselben Dateien, deren Pruefsummen im `NOTICE` stehen.
        working-directory: ipad/VisboxMac
        run: |
          set -euo pipefail
          PROGRAMM=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' App/Info.plist)
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' App/Info.plist)
          AUSGABE=$(swift build -c release --arch arm64 --show-bin-path)
          BUENDEL="$NAME.app"
          rm -rf "$BUENDEL"
          mkdir -p "$BUENDEL/Contents/MacOS" "$BUENDEL/Contents/Resources"
          cp "$AUSGABE/$PROGRAMM" "$BUENDEL/Contents/MacOS/$PROGRAMM"
          cp App/Info.plist "$BUENDEL/Contents/Info.plist"
          ditto ../Visbox.swiftpm/Schriften "$BUENDEL/Contents/Resources/Schriften"
          # DAS ICON (Owner-Entscheid 88, Blatt 20): erzeugt von `tools/make_icon.py`, Name wie
          # `CFBundleIconFile` in der Plist.
          cp App/Visbox.icns "$BUENDEL/Contents/Resources/Visbox.icns"
          # DIE BEISPIELMAPPE (Entscheid 49; bis 0.3.0 fuer den Vorfuehrmodus). Seit Entscheid
          # 103b zeigt die App sie nicht mehr als eigene Ansicht; sie bleibt im Buendel, weil
          # Schritt 3 («Mappe am Mac») sie als normale, mitgelieferte Mappe anbietet. Gelesen
          # ueber `Bundle.main`, also im Buendel, nicht im SwiftPM-Ausgabeordner.
          # DIE ECHTE, WENN ES SIE GIBT (`Vorfuehrmappe/`, am Heim-PC gerechnet, auf-218), sonst
          # die Platzhalter (`Beispielmappe/`). Die Platzhalter bleiben im Repo, weil die Proben
          # des Werkzeugs auf sie bauen; unter dem Namen im Buendel aendert sich nichts.
          if [ -f Vorfuehrmappe/vorfuehrmappe.json ]; then
            ditto Vorfuehrmappe "$BUENDEL/Contents/Resources/Beispielmappe"
          else
            ditto Beispielmappe "$BUENDEL/Contents/Resources/Beispielmappe"
          fi
          # DIE KNOTENANSICHT IM BUENDEL («Visbox eigenstaendig», Schritt 1, 20.10.2026): Die App
          # bedient sie ueber ihr eigenes Adressschema (`visbox://app/knoten/`, `Knotenquelle`)
          # aus `Contents/Resources/Knoten` — nicht mehr vom Heim-PC. Der eingecheckte Bau, ganz
          # (samt Lizenztexten der Schriften); ohne `index.html` haelt der Schritt an.
          test -f ../../kosmovis/apps/visbox-knoten/dist/index.html
          ditto ../../kosmovis/apps/visbox-knoten/dist "$BUENDEL/Contents/Resources/Knoten"
          plutil -lint "$BUENDEL/Contents/Info.plist"
          echo "BUENDEL=$BUENDEL" >> "$GITHUB_ENV"
          echo "NAME=$NAME" >> "$GITHUB_ENV"

      - name: Stehen Lokales Netzwerk und Bonjour in der Mac-App? (Auskunft)
        # OWNER-BEFUND 20.10.2026 (Naehe): wie beim iPad, aus der Plist im gebauten Buendel.
        # KEIN TOR, eine Auskunft.
        if: always()
        continue-on-error: true
        working-directory: ipad/VisboxMac
        run: |
          P="$BUENDEL/Contents/Info.plist"
          echo "--- NSLocalNetworkUsageDescription:"
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$P" || echo "KEIN NSLocalNetworkUsageDescription"
          echo "--- NSBonjourServices:"
          /usr/libexec/PlistBuddy -c 'Print :NSBonjourServices' "$P" || echo "KEIN NSBonjourServices"
          echo "--- NSCameraUsageDescription:"
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$P" || echo "KEIN NSCameraUsageDescription"

      - name: Liegt die Knotenansicht im Buendel? (Auskunft)
        # «Visbox eigenstaendig», Schritt 1: Die App laedt die Knoten aus dem Buendel. KEIN TOR,
        # eine Auskunft fuer das Protokoll (das Tor ist `test -f` oben): index.html, die Teile
        # unter assets/ und der Baustand.
        if: always()
        continue-on-error: true
        working-directory: ipad/VisboxMac
        run: |
          K="$BUENDEL/Contents/Resources/Knoten"
          if [ -f "$K/index.html" ]; then echo "index.html liegt im Buendel"; else echo "::warning::KEINE index.html unter $K"; fi
          ls -la "$K" "$K/assets" || true
          du -sh "$K" || true
          cat "$K/BAUSTAND.json" || true

      - name: Behelfs-Unterschrift
        # OHNE JEDE UNTERSCHRIFT STARTET EIN MAC MIT APPLE-CHIP NICHTS. Die Behelfs-Unterschrift
        # (`-`, «ad hoc») ist keine Beglaubigung durch Apple — der Mac haelt die App beim ersten
        # Oeffnen trotzdem an, und der Weg daran vorbei steht im LIESMICH der Mac-App. Sie
        # versiegelt aber das Buendel: Wer danach eine Datei darin aendert, bricht das Siegel.
        working-directory: ipad/VisboxMac
        run: |
          codesign --force --deep --sign - "$BUENDEL"
          codesign --verify --deep --strict --verbose=2 "$BUENDEL"

      - name: Als ZIP packen
        # `ditto`, nicht `zip`: Es behaelt, was ein Buendel braucht (Rechte, die Unterschrift
        # in den erweiterten Merkmalen), und `--keepParent` legt den Ordner `.app` selbst ins
        # Archiv, nicht nur seinen Inhalt.
        working-directory: ipad/VisboxMac
        run: ditto -c -k --keepParent "$BUENDEL" "$NAME-mac.zip"

      - name: Zum Herunterladen ablegen
        # VIERZEHN TAGE: lang genug, um sie nach der Abgabe am Mac zu probieren; kurz genug,
        # dass kein alter Stand liegen bleibt und wie der aktuelle aussieht.
        uses: actions/upload-artifact@v4
        with:
          name: Visbox-mac
          path: ipad/VisboxMac/${{ env.NAME }}-mac.zip
          retention-days: 14
          if-no-files-found: error

  freigabe:
    name: Freigabe bei neuer Nummer
    # DIE FREIGABE (Owner-Entscheid 84, 13.10.2026): Die Apps fragen
    # `…/releases/latest` dieses Repos und bieten an, was neuer ist. Bis dahin holte der Owner
    # jede Fassung von Hand als ZIP aus einem Lauf.
    #
    # NUR AUF `main` UND NIE IN EINEM PULL REQUEST: Ein Zweig, der die Nummer hochsetzt, legte
    # sonst eine Freigabe an, bevor er zusammengefuehrt ist — und die Apps boeten einen Stand an,
    # den es auf `main` nie gab. Ein `workflow_dispatch` auf einem Zweig laesst diesen Job darum
    # aus (belegt mit dem ersten Lauf auf dem Zweig des Baus, 13.10.2026).
    #
    # NUR BEI NEUER NUMMER (84b): Die Nummer aus `pyproject.toml` hat noch keinen Tag. Dass sie
    # an allen vier Stellen gleich ist, bewacht `tests/test_versionsnummer.py` — darunter das
    # iPad-Manifest, und weil es unter `ipad/` liegt, faehrt dieser Ablauf bei jeder neuen Nummer.
    #
    # NUR NACH GRUEN: `needs` wartet auf beide Jobs. Eine Freigabe, deren iPad-App nicht
    # uebersetzt, waere ein Angebot, das am Geraet scheitert.
    needs: [app, mac]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # DER EINZIGE JOB MIT SCHREIBRECHT — fuer Tag und Freigabe, nichts sonst.
    permissions:
      contents: write

    steps:
      - name: Stand holen
        uses: actions/checkout@v4

      - name: Nummer lesen, Tag suchen, Fassungsblatt finden
        id: nummer
        run: |
          set -euo pipefail
          NUMMER=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "Nummer: $NUMMER"
          if git ls-remote --exit-code --tags origin "refs/tags/v$NUMMER" > /dev/null; then
            echo "v$NUMMER hat schon einen Tag — keine neue Freigabe."
            echo "neu=nein" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # DAS FASSUNGSBLATT IST DER TEXT DER FREIGABE: genau eines je Nummer. Fehlt es, ist
          # der Lauf rot — eine Nummer ohne Blatt ist ein Versehen, kein Grund, still nichts
          # zu sagen.
          shopt -s nullglob
          BLAETTER=(docs/VISBOX_"$NUMMER"_*.md)
          if [ "${#BLAETTER[@]}" -ne 1 ]; then
            echo "::error::Fuer $NUMMER braucht es genau ein Fassungsblatt docs/VISBOX_${NUMMER}_<datum>.md (gefunden: ${#BLAETTER[@]})."
            exit 1
          fi
          NAME=$(python3 -c 'import plistlib; print(plistlib.load(open("ipad/VisboxMac/App/Info.plist", "rb"))["CFBundleName"])')
          {
            echo "neu=ja"
            echo "nummer=$NUMMER"
            echo "blatt=${BLAETTER[0]}"
            echo "name=$NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Die Mac-App aus dem Job `mac` holen
        if: steps.nummer.outputs.neu == 'ja'
        # DASSELBE ZIP, das der Job `mac` gebaut und abgelegt hat — nicht ein zweites Mal
        # gebaut. `actions/download-artifact` ist MIT (GitHub), laeuft nur hier in der
        # Pruefstrecke und geht nicht in die App ein (`NOTICE`).
        uses: actions/download-artifact@v4
        with:
          name: Visbox-mac
          path: freigabe

      - name: iPad-Paket, Pruefsummen, Freigabe
        if: steps.nummer.outputs.neu == 'ja'
        # `gh` IST AUF DEN RUNNERN VON GITHUB VORHANDEN (GitHub CLI, MIT) und spricht mit dem
        # Token dieses Laufs — kein eigener Schluessel, nichts im Repo.
        env:
          GH_TOKEN: ${{ github.token }}
          NUMMER: ${{ steps.nummer.outputs.nummer }}
          BLATT: ${{ steps.nummer.outputs.blatt }}
          NAME: ${{ steps.nummer.outputs.name }}
        run: |
          set -euo pipefail
          test -f "freigabe/$NAME-mac.zip"
          # DAS IPAD-PAKET ALS ZIP, mit dem Ordner selbst darin (`Visbox.swiftpm/…`): So
          # oeffnet es sich nach dem Entpacken am Mac mit Doppelklick in Xcode. Ohne `-y`, also
          # ohne Verweise — das App-Paket hat keine (`tests/test_ipad_geruest.py`).
          (cd ipad && zip -r -q -X "../freigabe/$NAME.swiftpm.zip" Visbox.swiftpm -x '*/.build/*' '*/.swiftpm/*')
          cp "$BLATT" freigabe/
          # DIE PRUEFSUMMEN IN DER FORM VON `sha256sum`: «<summe>  <name>» — so liest sie der
          # Kern (`Aktualisierung.summe`), und so prueft sie ein Mensch mit `shasum -a 256 -c`.
          (cd freigabe && sha256sum "$NAME-mac.zip" "$NAME.swiftpm.zip" "$(basename "$BLATT")" > SHA256SUMS.txt)
          cat freigabe/SHA256SUMS.txt
          gh release create "v$NUMMER" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$NAME $NUMMER" \
            --notes-file "$BLATT" \
            --latest \
            "freigabe/$NAME-mac.zip" \
            "freigabe/$NAME.swiftpm.zip" \
            "freigabe/$(basename "$BLATT")" \
            freigabe/SHA256SUMS.txt
