[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiimaging"
version = "0.0.1"
description = "Geometrie-treue KI-Architektur-Visualisierung: IFC-Geometrie hinein, verifizierte Bilder heraus."
readme = "README.md"
requires-python = ">=3.11"
# Tabellenform statt SPDX-String: die hier installierte setuptools 68 weist die
# PEP-639-Kurzform zurück. Geprüft, nicht vermutet.
license = { text = "Apache-2.0" }
authors = [{ name = "Andrin Bau" }]
classifiers = ["License :: OSI Approved :: Apache Software License"]

# Keine Laufzeitabhängigkeiten — und das ist Absicht, keine Lücke.
#
# BERICHTIGUNG 2026-08-18: Hier stand „Alles Schwere liegt jenseits einer Prozessgrenze
# in eigenen Environments". Das ist falsch, und die Lexikon-Durchsicht hat es gefunden.
# `render.lade_modell` und `tiefenschaetzer.lade_modell` importieren `torch`,
# `diffusers`, `transformers` und `Pillow` **in diesen Prozess** — verzögert, aber
# in-process. Mit `torch` kommt auf Linux über ein Gigabyte NVIDIA-Binärdateien in genau
# dieses Environment (docs/LIZENZPRUEFUNG_BINAER_2026-08-18.md).
#
# Die Prozessgrenze trennt nach **Lizenz**, nicht nach Gewicht. Jenseits von ihr liegt,
# was copyleft ist:
#
#   * ifcopenshell (LGPL, bringt CGAL/GPL-Anteile mit) lebt im separaten `.venv-ifc`
#     und wird über `AIIMAGING_IFC_PYTHON` angesprochen — nie importiert.
#   * Blender (GPL) wird als Binary über `blender --background` aufgerufen,
#     adressiert über `AIIMAGING_BLENDER` — kein `import bpy`, kein bpy-Wheel.
#
# Damit bleibt dieses Paket selbst permissiv lizenziert (Regel 1) und das
# Produkt-venv frei von bpy und ifcopenshell (Regel 2). Eine Abhängigkeit hier
# einzutragen heisst, diese Grenze zu verschieben — das ist eine Lizenzentscheidung,
# keine Bequemlichkeitsfrage.
#
# `torch` und `diffusers` sind BSD-3-Clause bzw. Apache-2.0 und damit unter Regel 1
# zulässig; die NVIDIA-Laufzeit ist proprietär, aber nicht copyleft und steckt darum
# Apache-2.0-Code nicht an. Eine Grenze braucht es dafür nicht — sie bräuchte es erst,
# wenn CUDA und eine GPL-Komponente in denselben Prozess müssten. Genau das verhindern
# die zwei Grenzen oben.
#
# Dass sie hier trotzdem nicht als Abhängigkeit stehen, hat einen anderen Grund: Die
# gesamte Testsammlung und die ganze QA-Kette laufen **ohne** sie. Wer sie nicht braucht,
# soll sie nicht installieren müssen.
dependencies = []

[project.optional-dependencies]
# `numpy` und `Pillow` gehoeren hierher und nicht zu den Laufzeitabhaengigkeiten: Der
# Kern rechnet ohne sie, `render.py` importiert sie ausdruecklich nur oertlich. Beide
# sind permissiv (numpy BSD-3, Pillow MIT-CMU) und unter Regel 1 unproblematisch; die
# Binaerpruefung dazu steht in docs/LIZENZPRUEFUNG_BINAER_2026-08-18.md.
#
# WARUM SIE TROTZDEM HIER STEHEN MUESSEN, und das ist keine Formalie: Vier Tests in
# `test_render.py` bewachen die 16-Bit-Skalierung. Am 22.08.2026 hat `auf-20260822-28`
# gemessen, dass die GEKLIPPTE Tiefenkarte die Ursache fuer monatelang schlechte Bilder
# war — eine Karte mit zwei Graustufen statt 235 war fuer das ControlNet exakt so viel
# wert wie GAR KEINE Konditionierung (ohne Fuehrung -0.2558, mit geklippter Karte
# -0.2540, Abstand 0.002).
#
# Am selben Tag verschwand `numpy` aus einer Umgebung, und genau diese vier Waechter
# setzten stillschweigend aus. Nachgeprueft: Stellt man den alten Fehler wieder her,
# faellt der Test — er taugt also. Ein Waechter, der nur laeuft, wenn zufaellig das
# richtige Paket da ist, bewacht nichts.
dev = ["pytest", "numpy", "Pillow"]
# Nur fuer die Anbindung an KosmoOrbit. Das MCP-SDK ist MIT und damit unter Regel 1
# zulaessig, zieht aber 19 transitive Abhaengigkeiten nach, die NICHT einzeln geprueft
# sind. Darum optional: Der Kern laeuft ohne, nur die Cockpit-Anbindung nicht.
#
# LIZENZ GEPRUEFT FUER DIE FASSUNG, DIE HIER WIRKLICH STEHT. Der urspruengliche Beleg
# galt der 2.0.0 — und genau die schliesst die Obergrenze unten aus. Ein Beleg fuer eine
# Fassung, die niemand installiert, ist kein Beleg; dieselbe Fehlerart wie bei der
# Stil-Schwelle, die aus DINOv3-Laeufen stammte und auf SigLIP 2 angewendet wurde.
# Nachgeholt 2026-08-18 an den PyPI-Metadaten BEIDER Enden der Spanne:
#     mcp 1.27.0  license "MIT", Classifier "License :: OSI Approved :: MIT License"
#     mcp 1.29.0  dito
# (1.29.0 ist derzeit die hoechste 1.x-Fassung; 2.0.0 ist ebenfalls MIT, aber wegen der
# entfernten Schnittstelle ausgeschlossen.)
#
# OBERGRENZE <2, gemessen auf der HomeStation am 18.08.2026: `mcp_server.py` ist gegen
# die 1.x-Dekoratorschnittstelle geschrieben (`@server.list_tools()`), und mcp 2.0.0 hat
# `list_tools`/`call_tool` von `Server` entfernt. Der Server startet dort gar nicht:
#     AttributeError: 'Server' object has no attribute 'list_tools'
# Die Zeile stand vorher auf `mcp>=2.0` und verlangte damit genau die Fassung, unter der
# der Code bricht — die Lizenzpruefung galt der 2.0.0, der Code nie. Wer die Obergrenze
# hebt, muss `baue_server()` auf die neue Schnittstelle umschreiben.
mcp = ["mcp>=1.27,<2"]

# src-Layout: der importierbare Code liegt unter src/, damit Tests gegen das
# installierte Paket laufen und nicht versehentlich gegen das Arbeitsverzeichnis.
[tool.setuptools]
package-dir = { "" = "src" }
packages = ["aiimaging", "aiimaging.runners"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
