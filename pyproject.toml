[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiimaging"
version = "0.0.1"
description = "Geometrie-treue KI-Architektur-Visualisierung: IFC-Geometrie hinein, verifizierte Bilder heraus."
readme = "README.md"
requires-python = ">=3.11"
# Tabellenform statt SPDX-String: die hier installierte setuptools 68 weist die
# PEP-639-Kurzform zurück. Geprüft, nicht vermutet.
license = { text = "Apache-2.0" }
authors = [{ name = "Andrin Bau" }]
classifiers = ["License :: OSI Approved :: Apache Software License"]

# Keine Laufzeitabhängigkeiten — und das ist Absicht, keine Lücke.
#
# BERICHTIGUNG 2026-08-18: Hier stand „Alles Schwere liegt jenseits einer Prozessgrenze
# in eigenen Environments". Das ist falsch, und die Lexikon-Durchsicht hat es gefunden.
# `render.lade_modell` und `tiefenschaetzer.lade_modell` importieren `torch`,
# `diffusers`, `transformers` und `Pillow` **in diesen Prozess** — verzögert, aber
# in-process. Mit `torch` kommt auf Linux über ein Gigabyte NVIDIA-Binärdateien in genau
# dieses Environment (docs/LIZENZPRUEFUNG_BINAER_2026-08-18.md).
#
# Die Prozessgrenze trennt nach **Lizenz**, nicht nach Gewicht. Jenseits von ihr liegt,
# was copyleft ist:
#
#   * ifcopenshell (LGPL, bringt CGAL/GPL-Anteile mit) lebt im separaten `.venv-ifc`
#     und wird über `AIIMAGING_IFC_PYTHON` angesprochen — nie importiert.
#   * Blender (GPL) wird als Binary über `blender --background` aufgerufen,
#     adressiert über `AIIMAGING_BLENDER` — kein `import bpy`, kein bpy-Wheel.
#
# Damit bleibt dieses Paket selbst permissiv lizenziert (Regel 1) und das
# Produkt-venv frei von bpy und ifcopenshell (Regel 2). Eine Abhängigkeit hier
# einzutragen heisst, diese Grenze zu verschieben — das ist eine Lizenzentscheidung,
# keine Bequemlichkeitsfrage.
#
# `torch` und `diffusers` sind BSD-3-Clause bzw. Apache-2.0 und damit unter Regel 1
# zulässig; die NVIDIA-Laufzeit ist proprietär, aber nicht copyleft und steckt darum
# Apache-2.0-Code nicht an. Eine Grenze braucht es dafür nicht — sie bräuchte es erst,
# wenn CUDA und eine GPL-Komponente in denselben Prozess müssten. Genau das verhindern
# die zwei Grenzen oben.
#
# Dass sie hier trotzdem nicht als Abhängigkeit stehen, hat einen anderen Grund: Die
# gesamte Testsammlung und die ganze QA-Kette laufen **ohne** sie. Wer sie nicht braucht,
# soll sie nicht installieren müssen.
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
# Nur fuer die Anbindung an KosmoOrbit. Das MCP-SDK ist MIT (geprueft 2026-08-18 gegen
# die PyPI-Metadaten von mcp 2.0.0) und damit unter Regel 1 zulaessig, zieht aber 19
# transitive Abhaengigkeiten nach, die NICHT einzeln geprueft sind. Darum optional:
# Der Kern laeuft ohne, nur die Cockpit-Anbindung nicht.
mcp = ["mcp>=2.0"]

# src-Layout: der importierbare Code liegt unter src/, damit Tests gegen das
# installierte Paket laufen und nicht versehentlich gegen das Arbeitsverzeichnis.
[tool.setuptools]
package-dir = { "" = "src" }
packages = ["aiimaging", "aiimaging.runners"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
