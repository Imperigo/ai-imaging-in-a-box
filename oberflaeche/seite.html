<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visbox</title>
<!--
  KEIN SKRIPT UND KEINE SCHRIFT VON EINEM FREMDEN SERVER, und das ist eine Auflage und
  keine Sparsamkeit: Das Ziel ist ein Ein-Klick-Download. Was zum Start eine
  Netzverbindung braucht, ist keiner — und eine Schriftart von einem fremden Server ist
  eine Netzverbindung.  `tests/test_oberflaeche.py` haelt es fest.
-->
<style>
  :root {
    --grund: #14161a; --feld: #1c1f26; --rand: #2b3038;
    --schrift: #e6e8ec; --leise: #9aa2ae;
    --bestanden: #4ea373; --durchgefallen: #c2554f; --ungemessen: #c8a53f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--grund); color: var(--schrift);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--rand);
    display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap;
  }
  h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  main { padding: 20px; display: grid; gap: 20px; grid-template-columns: 1fr; max-width: 1100px; }
  @media (min-width: 900px) { main { grid-template-columns: 340px 1fr; } }
  section { background: var(--feld); border: 1px solid var(--rand); border-radius: 8px; padding: 16px; }
  h2 { font-size: 13px; margin: 0 0 12px; color: var(--leise);
       text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  input, button {
    font: inherit; background: var(--grund); color: var(--schrift);
    border: 1px solid var(--rand); border-radius: 6px; padding: 7px 10px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--leise); }
  .leise { color: var(--leise); }
  .satz { color: var(--leise); font-size: 13px; margin-top: 4px; }

  /* DIE DREI ZEICHEN — und sie sind mit ABSICHT verschieden stark.
     Ein ungeprueftes Bild darf nie aussehen wie ein bestandenes, und auch nicht wie
     gar nichts: Kein Abzeichen sieht aus wie kein Problem. */
  .zeichen {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    font-size: 12px; font-weight: 600; letter-spacing: .03em; border: 1px solid;
  }
  .bestanden      { color: var(--bestanden);      border-color: var(--bestanden); }
  .durchgefallen  { color: var(--durchgefallen);  border-color: var(--durchgefallen); }
  .nicht-gemessen { color: var(--ungemessen);     border-color: var(--ungemessen);
                    border-style: dashed; }

  .bild { border: 1px solid var(--rand); border-radius: 6px; padding: 12px; margin-bottom: 10px; }
  .bild .kopf { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .bild .name { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; }

  /* DAS ABZEICHEN SITZT AUF DEM BILD, nicht daneben.
     Ein Bild wird angesehen, eine Liste daneben gelesen — und beim Weiterreichen
     (Bildschirmfoto, Ausschnitt) bleibt nur das Bild uebrig. Ein Vorbehalt, der beim
     ersten Weiterreichen abfaellt, ist kein Vorbehalt. */
  .rahmen { position: relative; margin: 10px 0 8px; border-radius: 6px; overflow: hidden;
            border: 2px solid var(--rand); background: #0e1013; }
  .rahmen.bestanden      { border-color: var(--bestanden); }
  .rahmen.durchgefallen  { border-color: var(--durchgefallen); }
  .rahmen.nicht-gemessen { border-color: var(--ungemessen); border-style: dashed; }
  .rahmen img { display: block; width: 100%; height: auto; }
  .rahmen .auflage {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 10px;
    font-size: 12px; font-weight: 600; letter-spacing: .03em;
    background: rgba(8,10,13,.82); backdrop-filter: blur(2px);
  }
  .rahmen.bestanden      .auflage { color: var(--bestanden); }
  .rahmen.durchgefallen  .auflage { color: var(--durchgefallen); }
  .rahmen.nicht-gemessen .auflage { color: var(--ungemessen); }

  /* WO DIE DATEI FEHLT, steht die Luecke da — und zwar in der Groesse, die das Bild
     haette. Ein Name ohne Datei sieht in einer Liste genauso aus wie einer mit. */
  .fehlt { padding: 26px 12px; text-align: center; color: var(--leise); font-size: 13px; }

  /* NEBENEINANDER. Ohne Vorher gibt es kein Nachher — und die Frage dieses Projekts
     lautet, ob das KI-Bild dem Modell noch folgt. Das sieht man nur im Vergleich. */
  .paar { display: grid; gap: 12px; grid-template-columns: 1fr; }
  @media (min-width: 720px) { .paar { grid-template-columns: 1fr 1fr; } }
  .paar .titel { font-size: 12px; color: var(--leise); text-transform: uppercase;
                 letter-spacing: .06em; margin-bottom: 6px; }
  .basis { margin-top: 8px; padding-left: 12px; border-left: 2px solid var(--rand);
           font-size: 13px; color: var(--leise); }

  .knoten { display: flex; gap: 10px; align-items: baseline; padding: 7px 0;
            border-bottom: 1px solid var(--rand); }
  .knoten:last-child { border-bottom: 0; }
  .knoten .art { font-family: ui-monospace, Menlo, monospace; font-size: 13px; min-width: 96px; }
  .knoten .von { font-size: 12px; color: var(--leise); }
  .meldung { border-left: 3px solid var(--ungemessen); padding: 8px 12px; margin-top: 10px;
             background: rgba(200,165,63,.07); font-size: 13px; }
  .fehler  { border-left-color: var(--durchgefallen); background: rgba(194,85,79,.08); }
  .knoten { display: block; }
  .knoten > .zeile { display: flex; gap: 10px; align-items: baseline; cursor: pointer; }
  .knoten > .zeile:hover .art { color: #fff; }
  .felder { margin: 8px 0 10px 12px; padding-left: 12px; border-left: 2px solid var(--rand);
            display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; }
  .felder label { font-size: 13px; color: var(--leise); font-family: ui-monospace, Menlo, monospace; }
  .felder input { width: 100%; font-size: 13px; padding: 5px 8px; }
  /* GESETZT SIEHT ANDERS AUS ALS VORGEGEBEN. Sonst weiss nach einer Woche niemand mehr,
     was er selbst entschieden hat und was das Programm mitbringt. */
  .felder input.gesetzt { border-color: var(--leise); color: var(--schrift); }
  .felder input:not(.gesetzt) { color: var(--leise); font-style: italic; }
  .knopfzeile { margin-top: 10px; display: flex; gap: 8px; align-items: center; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
  dt { color: var(--leise); }
  dd { margin: 0; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header>
  <h1>Visbox</h1>
  <input id="ordner" placeholder="Projektordner" size="34">
  <button id="laden">Öffnen</button>
  <button id="rechnen">Rechnen</button>
  <span id="stand" class="leise"></span>
</header>

<main>
  <section>
    <h2>Modell</h2>
    <div id="modell" class="leise">Noch kein Projekt geöffnet.</div>
  </section>

  <section>
    <h2>Was gerechnet würde</h2>
    <div id="baum" class="leise">—</div>
  </section>

  <section style="grid-column: 1 / -1">
    <h2>Bilder</h2>
    <div id="bilder" class="leise">—</div>
  </section>
</main>

<script>
"use strict";

// KEIN RAHMENWERK. Die Flaeche zeigt vier Dinge an; dafuer eines einzubinden hiesse, eine
// Abhaengigkeit zu pflegen, zu installieren und lizenzzupruefen — fuer Code, der hier in
// hundert Zeilen steht.

const $ = (id) => document.getElementById(id);

/** Text einsetzen, niemals HTML. Ein Dateiname kommt von der Platte eines Menschen und
 *  ist damit fremder Text; ihn als HTML zu setzen hiesse, ihm zu erlauben, diese Seite
 *  umzubauen. */
function feld(tag, klasse, text) {
  const e = document.createElement(tag);
  if (klasse) e.className = klasse;
  if (text !== undefined && text !== null) e.textContent = String(text);
  return e;
}

function liste(paare) {
  const dl = feld("dl");
  for (const [k, v] of paare) {
    if (v === undefined || v === null || v === "") continue;
    dl.append(feld("dt", null, k), feld("dd", null, v));
  }
  return dl;
}

/** DIE DREI ZEICHEN. Hier steht keine Bedingung darueber, OB etwas gemessen wurde —
 *  das hat der Server aus der Bibliothek geholt. Hier wird nur angezeigt. */
function zeichenFuer(bild) {
  const beschriftung = {
    "bestanden": "bestanden",
    "durchgefallen": "durchgefallen",
    "nicht-gemessen": "nicht gemessen",
  }[bild.zeichen] || bild.zeichen;
  return feld("span", "zeichen " + bild.zeichen, beschriftung);
}

function zeigeModell(d) {
  const ziel = $("modell");
  ziel.replaceChildren();
  ziel.className = "";
  ziel.append(liste([
    ["Projekt", d.name],
    ["Datei", d.modell.pfad],
    ["Format", d.modell.einlass.format || d["import"].format],
    ["Weg herein", d["import"].weg],
    ["Hochachse", d["import"].hochachse_steht_fest
       ? d["import"].hochachse
       : (d.einstellungen.up_axis ? d.einstellungen.up_axis + " (angegeben)" : "nicht bekannt")],
  ]));

  // DER ZUSTAND DES MODELLS steht als Satz da und nicht als Farbe. Ein geaendertes
  // Modell haelt hier nichts an — es wird gemeldet, wie in der Bibliothek auch.
  if (d.modell.stand !== "unveraendert") {
    ziel.append(feld("div", "meldung", d.modell.grund));
  }
  // Was beim Import NICHT geprueft wurde, gehoert hierher und nicht in eine Fussnote.
  if (d["import"].treue === null || d["import"].treue === undefined) {
    ziel.append(feld("div", "satz",
      "Ob die Umwandlung die Geometrie getroffen hat, ist NICHT GEPRÜFT — dafür müsste " +
      "bekannt sein, was herauskommen soll."));
  }
  for (const h of (d["import"].hinweise || [])) ziel.append(feld("div", "satz", h));
}

/** Ein Eingabefeld zu einem Bedienfeld der Bibliothek.
 *
 *  DIE FELDER WERDEN NICHT HIER AUFGEZAEHLT. Sie kommen aus `baue_kette`, und die
 *  Zuordnung zum Knoten ist am gebauten Graphen abgelesen. Eine Liste an dieser Stelle
 *  waere in dem Augenblick veraltet, in dem die Bibliothek etwas dazubekommt — und genau
 *  so ist die Luecke entstanden, in der elf Bestellungen nicht erreichbar waren.
 */
function eingabe(f) {
  const e = feld("input");
  e.dataset.name = f.name;
  e.value = f.gesetzt ? alsText(f.wert) : "";
  e.placeholder = f.vorgabe === null || f.vorgabe === undefined
    ? "nicht gesetzt" : alsText(f.vorgabe);
  if (f.gesetzt) e.classList.add("gesetzt");
  e.addEventListener("input", () => e.classList.toggle("gesetzt", e.value.trim() !== ""));
  return e;
}

function alsText(w) {
  if (w === null || w === undefined) return "";
  return (typeof w === "object") ? JSON.stringify(w) : String(w);
}

/** Aus dem Eingabefeld wieder ein Wert.
 *
 *  LEER HEISST NICHT GESETZT, nicht «leerer Text»: Der Server entfernt das Feld dann, und
 *  es gilt wieder die Vorgabe der Bibliothek. Ein leerer Text waere etwas anderes — eine
 *  ausdrueckliche Angabe von nichts.
 */
function ausText(roh) {
  const s = roh.trim();
  if (s === "") return null;
  if (s === "true") return true;
  if (s === "false") return false;
  if (s !== "" && !isNaN(Number(s))) return Number(s);
  if (s.startsWith("{") || s.startsWith("[")) {
    try { return JSON.parse(s); } catch (f) { return s; }
  }
  return s;
}

function zeigeBaum(d) {
  const ziel = $("baum");
  ziel.replaceChildren();
  ziel.className = "";
  if (d.knotenbaum_fehler) {
    ziel.append(feld("div", "meldung fehler", d.knotenbaum_fehler));
  }
  if (!d.knotenbaum.length && !d.knotenbaum_fehler) {
    ziel.className = "leise";
    ziel.textContent = "Keine Rechnung möglich — es fehlt die umgewandelte Geometrie.";
    return;
  }

  const felderJeKnoten = new Map();
  const ohneKnoten = [];
  for (const f of (d.bedienfelder || [])) {
    if (f.knoten) {
      if (!felderJeKnoten.has(f.knoten)) felderJeKnoten.set(f.knoten, []);
      felderJeKnoten.get(f.knoten).push(f);
    } else {
      ohneKnoten.push(f);
    }
  }

  for (const k of d.knotenbaum) {
    const block = feld("div", "knoten");
    const zeile = feld("div", "zeile");
    zeile.append(feld("span", "art", k.art));
    zeile.append(feld("span", "von",
      k.eingaenge.length ? "aus " + k.eingaenge.join(", ") : "Anfang"));
    const eigene = felderJeKnoten.get(k.id) || [];
    zeile.append(feld("span", "von", eigene.length ? eigene.length + " Einstellungen" : ""));
    block.append(zeile);

    const felder = feld("div", "felder");
    felder.hidden = true;
    for (const f of eigene) {
      felder.append(feld("label", null, f.name));
      felder.append(eingabe(f));
    }
    if (eigene.length) {
      zeile.addEventListener("click", () => { felder.hidden = !felder.hidden; });
      block.append(felder);
    }
    ziel.append(block);
  }

  if (ohneKnoten.length) {
    const block = feld("div", "knoten");
    // DREI ANTWORTEN, DREI SAETZE. «Kein Knoten» hiess dreierlei, und die drei sahen
    // gleich aus — genau die Verwechslung, gegen die diese Flaeche sonst ueberall steht.
    const bau = ohneKnoten.filter((f) => f.wirkt_auf === "bau").length;
    block.append(feld("div", "satz", bau === ohneKnoten.length
      ? "Diese Angaben bestimmen, WELCHE Knoten es gibt — nicht den Inhalt eines einzelnen:"
      : "Diese Angaben gehören zu keinem einzelnen Knoten. Bei den mit «?» markierten " +
        "hat die Prüfung nicht feststellen können, wo sie wirken:"));
    const felder = feld("div", "felder");
    for (const f of ohneKnoten) {
      felder.append(feld("label", null,
        f.wirkt_auf === "unbekannt" ? f.name + " ?" : f.name));
      felder.append(eingabe(f));
    }
    block.append(felder);
    ziel.append(block);
  }

  const zeile = feld("div", "knopfzeile");
  const knopf = feld("button", null, "Einstellungen übernehmen");
  knopf.addEventListener("click", uebernehmen);
  zeile.append(knopf);
  zeile.append(feld("span", "satz",
    "Leer lassen heisst: es gilt die Vorgabe des Programms."));
  ziel.append(zeile);
}

/** Alle Felder einsammeln und der Bibliothek vorlegen.
 *
 *  GEPRUEFT WIRD NICHT HIER. Der Server baut die Kette mit den neuen Werten; baut sie
 *  nicht, kommt der Satz der Bibliothek zurueck und es wird NICHTS gespeichert. Eine
 *  Flaeche mit eigenen Regeln ueber zulaessige Werte haette dieselbe Regel zweimal.
 */
async function uebernehmen() {
  const werte = {};
  for (const e of document.querySelectorAll(".felder input")) {
    werte[e.dataset.name] = ausText(e.value);
  }
  $("stand").textContent = "übernimmt …";
  try {
    const antwort = await fetch("/api/einstellungen", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ordner: $("ordner").value.trim(), einstellungen: werte}),
    });
    const d = await antwort.json();
    if (d.fehler) { $("stand").textContent = d.fehler; return; }
    await laden();
    $("stand").textContent = "Einstellungen übernommen.";
  } catch (f) {
    $("stand").textContent = "Die Änderung liess sich nicht speichern: " + f;
  }
}

/** Der Weg, unter dem der Server ein Bild dieses Projekts ausliefert.
 *  Beide Teile werden kodiert: Ein Dateiname darf ein `&` enthalten, und ohne Kodierung
 *  waere ab dort ein zweiter Parameter daraus geworden. */
function bildweg(ordner, name) {
  return "/bild?ordner=" + encodeURIComponent(ordner) + "&name=" + encodeURIComponent(name);
}

/** Ein Bild mit seinem Abzeichen AUF dem Bild — oder die Luecke, wenn die Datei weg ist.
 *
 *  Hier wird nichts entschieden: `zeichen`, `satz` und `vorhanden` kommen fertig vom
 *  Server, der sie aus der Bibliothek hat. Diese Funktion setzt sie nur hin. */
function bildrahmen(ordner, b) {
  const rahmen = feld("div", "rahmen " + b.zeichen);

  if (b.vorhanden === false) {
    rahmen.append(feld("div", "fehlt",
      "Die Datei gibt es nicht (mehr). Das Projekt nennt sie weiter — " +
      "hier wird nichts hinter Ihrem Rücken gelöscht."));
  } else if (b.vorhanden === null) {
    // UNBEKANNT, nicht «weg». Die Frage wurde nicht gestellt.
    rahmen.append(feld("div", "fehlt", "Ob die Datei da ist, wurde nicht geprüft."));
  } else {
    const bild = feld("img");
    bild.src = bildweg(ordner, b.bild);
    bild.alt = b.bild;
    bild.loading = "lazy";
    // UND WENN DAS LADEN SCHEITERT, bleibt kein leerer Rahmen stehen. Ein leerer Rahmen
    // mit gruenem Abzeichen waere genau die Beruhigung, gegen die dieses Feld gebaut ist.
    bild.onerror = () => {
      bild.remove();
      rahmen.prepend(feld("div", "fehlt", "Das Bild liess sich nicht laden."));
    };
    rahmen.append(bild);
  }

  // DIE AUFLAGE STEHT IMMER DA, auch am bestandenen Bild und auch an der Luecke.
  // Kein Abzeichen sieht aus wie kein Problem.
  rahmen.append(feld("div", "auflage", zeichenwort(b) + " · " + b.satz));
  return rahmen;
}

function zeichenwort(b) {
  return {
    "bestanden": "GEPRÜFT",
    "durchgefallen": "DURCHGEFALLEN",
    "nicht-gemessen": "NICHT GEPRÜFT",
  }[b.zeichen] || b.zeichen;
}

/** Das Bild und seine Unterlage nebeneinander — wenn es eine gibt.
 *
 *  Die Unterlage ist der Geometrielayer (E20): das Bild, auf dem dieses hier aufsetzt.
 *  Ihr Urteil steht unter `basis` und NIE im selben Feld wie das eigene. */
function nebeneinander(ordner, b, alleBilder) {
  const unterlage = b.basis && b.basis.bild
    ? alleBilder.find((x) => x.bild === b.basis.bild) : null;
  if (!unterlage) return bildrahmen(ordner, b);

  const paar = feld("div", "paar");
  for (const [titel, eintrag] of [["Unterlage", unterlage], ["Dieses Bild", b]]) {
    const spalte = feld("div");
    spalte.append(feld("div", "titel", titel));
    spalte.append(bildrahmen(ordner, eintrag));
    paar.append(spalte);
  }
  return paar;
}

function zeigeBilder(d) {
  const ziel = $("bilder");
  ziel.replaceChildren();
  ziel.className = d.bilder.length ? "" : "leise";
  if (!d.bilder.length) { ziel.textContent = "Noch keine Bilder in diesem Projekt."; return; }

  for (const b of d.bilder) {
    const karte = feld("div", "bild");
    const kopf = feld("div", "kopf");
    kopf.append(zeichenFuer(b));
    kopf.append(feld("span", "name", b.bild));
    kopf.append(feld("span", "leise", b.schicht));
    karte.append(kopf);
    // DER SATZ STEHT IMMER DA, auch beim bestandenen Bild. Eine Zahl ohne ihre Bedingung
    // ist keine Auskunft — und ein Abzeichen ohne Satz ist eine Zahl ohne Bedingung.
    karte.append(feld("div", "satz", b.satz));

    // UND JETZT DAS BILD SELBST. Bis zum 21.09.2026 nannte diese Flaeche nur Dateinamen
    // und Urteile — ein Werkzeug fuer Bilder, das keine Bilder zeigt.
    karte.append(nebeneinander(d.ordner, b, d.bilder));

    if (b.basis) {
      const u = b.basis.geometrie_bestanden;
      const wort = u === true ? "bestanden" : (u === false ? "durchgefallen" : "nicht gemessen");
      const block = feld("div", "basis");
      block.append(feld("div", null,
        "Darunter liegt " + (b.basis.bild || "ein Bild") + " — dessen Geometrie ist " +
        wort + "."));
      if (b.basis.grund) block.append(feld("div", "satz", b.basis.grund));
      if (b.basis.herkunft) block.append(feld("div", "satz", "Zuordnung: " + b.basis.herkunft));
      karte.append(block);
    }

    const h = b.herkunft || {};
    karte.append(liste([
      ["Prompt", h.prompt], ["Backbone", h.backbone], ["Startwert", h.seed],
      ["Modellstand", h.modell_stand !== "unveraendert" ? h.modell_stand : null],
    ]));
    ziel.append(karte);
  }
}

async function laden() {
  const ordner = $("ordner").value.trim();
  $("stand").textContent = "lädt …";
  try {
    const antwort = await fetch("/api/projekt?ordner=" + encodeURIComponent(ordner));
    const d = await antwort.json();
    if (d.fehler) { $("stand").textContent = d.fehler; return; }
    zeigeModell(d); zeigeBaum(d); zeigeBilder(d);
    $("stand").textContent = d.bilder.length + " Bilder, " + d.laeufe.length + " Läufe";
  } catch (f) {
    $("stand").textContent = "Die Oberfläche erreicht ihren eigenen Dienst nicht: " + f;
  }
}

async function rechnen() {
  $("stand").textContent = "rechnet …";
  try {
    const antwort = await fetch("/api/rechne", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ordner: $("ordner").value.trim()}),
    });
    const d = await antwort.json();
    // EIN FEHLSCHLAG WIRD ANGEZEIGT, NICHT VERSCHLUCKT. Er ist ein Satz aus der
    // Bibliothek und fuer einen Menschen geschrieben.
    $("stand").textContent = d.fehler ? d.fehler
      : (d.vermerkt + " Bilder eingetragen" + (d.error ? " — " + d.error : ""));
    if (!d.fehler) await laden();
  } catch (f) {
    $("stand").textContent = "Der Lauf liess sich nicht starten: " + f;
  }
}
