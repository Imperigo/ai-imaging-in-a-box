<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visbox</title>
<!--
  KEIN SKRIPT UND KEINE SCHRIFT VON EINEM FREMDEN SERVER, und das ist eine Auflage und
  keine Sparsamkeit: Das Ziel ist ein Ein-Klick-Download. Was zum Start eine
  Netzverbindung braucht, ist keiner — und eine Schriftart von einem fremden Server ist
  eine Netzverbindung.  `tests/test_oberflaeche.py` haelt es fest.
-->
<style>
  :root {
    --grund: #14161a; --feld: #1c1f26; --rand: #2b3038;
    --schrift: #e6e8ec; --leise: #9aa2ae;
    /* DAS ROT WAR ZU DUNKEL ZUM LESEN, und es traf ausgerechnet die eine Aussage,
       die niemand ueberlesen darf. Nachgerechnet am 22.09.2026: #c2554f erreicht auf
       dem Grund 4.06 und auf einem Feld 3.70 — unter dem Mindestmass von 4.5 fuer
       gewoehnliche Schriftgroesse. #e2776f erreicht 6.13 bzw. 5.58.

       Ein Warnzeichen, das man nur bei guter Beleuchtung liest, warnt bei schlechter
       nicht — und die Oberflaeche steht auf einem Bildschirm im Tageslicht.

       Es ist derselbe Wert wie im iPad-Entwurf: Eine Bedeutung hat eine Farbe, sonst
       sehen zwei Flaechen desselben Werkzeugs verschieden aus und niemand weiss, welche
       gilt. `tests/test_kontrast.py` rechnet es aus dieser Datei nach. */
    --bestanden: #4ea373; --durchgefallen: #e2776f; --ungemessen: #c8a53f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--grund); color: var(--schrift);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--rand);
    display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap;
  }
  h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  main { padding: 20px; display: grid; gap: 20px; grid-template-columns: 1fr; max-width: 1100px; }
  @media (min-width: 900px) { main { grid-template-columns: 340px 1fr; } }
  section { background: var(--feld); border: 1px solid var(--rand); border-radius: 8px; padding: 16px; }
  h2 { font-size: 13px; margin: 0 0 12px; color: var(--leise);
       text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  input, button {
    font: inherit; background: var(--grund); color: var(--schrift);
    border: 1px solid var(--rand); border-radius: 6px; padding: 7px 10px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--leise); }
  .leise { color: var(--leise); }
  .satz { color: var(--leise); font-size: 13px; margin-top: 4px; }

  /* DIE DREI ZEICHEN — und sie sind mit ABSICHT verschieden stark.
     Ein ungeprueftes Bild darf nie aussehen wie ein bestandenes, und auch nicht wie
     gar nichts: Kein Abzeichen sieht aus wie kein Problem. */
  .zeichen {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    font-size: 12px; font-weight: 600; letter-spacing: .03em; border: 1px solid;
  }
  .bestanden      { color: var(--bestanden);      border-color: var(--bestanden); }
  .durchgefallen  { color: var(--durchgefallen);  border-color: var(--durchgefallen); }
  .nicht-gemessen { color: var(--ungemessen);     border-color: var(--ungemessen);
                    border-style: dashed; }

  .bild { border: 1px solid var(--rand); border-radius: 6px; padding: 12px; margin-bottom: 10px; }
  .bild .kopf { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .bild .name { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; }

  /* DAS ABZEICHEN SITZT AUF DEM BILD, nicht daneben.
     Ein Bild wird angesehen, eine Liste daneben gelesen — und beim Weiterreichen
     (Bildschirmfoto, Ausschnitt) bleibt nur das Bild uebrig. Ein Vorbehalt, der beim
     ersten Weiterreichen abfaellt, ist kein Vorbehalt. */
  .rahmen { position: relative; margin: 10px 0 8px; border-radius: 6px; overflow: hidden;
            border: 2px solid var(--rand); background: #0e1013; }
  .rahmen.bestanden      { border-color: var(--bestanden); }
  .rahmen.durchgefallen  { border-color: var(--durchgefallen); }
  .rahmen.nicht-gemessen { border-color: var(--ungemessen); border-style: dashed; }
  .rahmen img { display: block; width: 100%; height: auto; }
  .rahmen .auflage {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 10px;
    font-size: 12px; font-weight: 600; letter-spacing: .03em;
    /* DER STREIFEN MUSS DECKEN, WEIL DAS BILD DARUNTER HELL SEIN DARF.
       Mit .82 Deckkraft liess ein helles Bild (Himmel, weisser Render) den Streifen auf
       etwa #343639 aufhellen — und dort fielen ALLE VIER farbigen Aussagen unter das
       Mindestmass: bestanden 3.93, durchgefallen 4.10, leise 4.71, nicht gemessen 5.14.
       Gefunden am 22.09.2026 vom eigenen Kontrast-Waechter, nicht von Hand.

       Ein Abzeichen, dessen Lesbarkeit vom Bild abhaengt, auf dem es sitzt, ist auf dem
       hellen Bild keines — und helle Bilder sind in diesem Projekt der Normalfall.

       .94 laesst noch erkennen, dass ein Bild darunter liegt, und haelt im
       unguenstigsten Fall 5.71. `tests/test_kontrast.py` liest die Deckkraft aus dieser
       Zeile und rechnet sie ueber Weiss nach. */
    background: rgba(8,10,13,.94); backdrop-filter: blur(2px);
  }
  .rahmen.bestanden      .auflage { color: var(--bestanden); }
  .rahmen.durchgefallen  .auflage { color: var(--durchgefallen); }
  .rahmen.nicht-gemessen .auflage { color: var(--ungemessen); }

  /* WO DIE DATEI FEHLT, steht die Luecke da — und zwar in der Groesse, die das Bild
     haette. Ein Name ohne Datei sieht in einer Liste genauso aus wie einer mit. */
  .fehlt { padding: 26px 12px; text-align: center; color: var(--leise); font-size: 13px; }

  /* NEBENEINANDER. Ohne Vorher gibt es kein Nachher — und die Frage dieses Projekts
     lautet, ob das KI-Bild dem Modell noch folgt. Das sieht man nur im Vergleich. */
  .paar { display: grid; gap: 12px; grid-template-columns: 1fr; }
  @media (min-width: 720px) { .paar { grid-template-columns: 1fr 1fr; } }
  .paar .titel { font-size: 12px; color: var(--leise); text-transform: uppercase;
                 letter-spacing: .06em; margin-bottom: 6px; }
  .basis { margin-top: 8px; padding-left: 12px; border-left: 2px solid var(--rand);
           font-size: 13px; color: var(--leise); }

  .knoten { display: flex; gap: 10px; align-items: baseline; padding: 7px 0;
            border-bottom: 1px solid var(--rand); }
  .knoten:last-child { border-bottom: 0; }
  .knoten .art { font-family: ui-monospace, Menlo, monospace; font-size: 13px; min-width: 96px; }
  .knoten .von { font-size: 12px; color: var(--leise); }
  .meldung { border-left: 3px solid var(--ungemessen); padding: 8px 12px; margin-top: 10px;
             background: rgba(200,165,63,.07); font-size: 13px; }
  .fehler  { border-left-color: var(--durchgefallen); background: rgba(226,119,111,.09); }
  .knoten { display: block; }
  .knoten > .zeile { display: flex; gap: 10px; align-items: baseline; cursor: pointer; }
  .knoten > .zeile:hover .art { color: #fff; }
  .felder { margin: 8px 0 10px 12px; padding-left: 12px; border-left: 2px solid var(--rand);
            display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; }
  .felder label { font-size: 13px; color: var(--leise); font-family: ui-monospace, Menlo, monospace; }
  .felder input { width: 100%; font-size: 13px; padding: 5px 8px; }
  /* GESETZT SIEHT ANDERS AUS ALS VORGEGEBEN. Sonst weiss nach einer Woche niemand mehr,
     was er selbst entschieden hat und was das Programm mitbringt. */
  .felder input.gesetzt { border-color: var(--leise); color: var(--schrift); }
  .felder input:not(.gesetzt) { color: var(--leise); font-style: italic; }
  .knopfzeile { margin-top: 10px; display: flex; gap: 8px; align-items: center; }
  /* DER LAUF. Zwei Sorten Lebenszeichen, und sie sehen mit ABSICHT verschieden aus:
     Ein Balken behauptet, man wisse, wie weit es ist. Das weiss man nur bei gezaehlten
     Schritten — bei allem anderen laeuft nur Zeit. */
  .laufzeile { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
  .laufzeile .art { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .balkenrahmen { height: 6px; border-radius: 3px; background: var(--rand);
                  margin: 8px 0 4px; overflow: hidden; }
  #balken { height: 100%; width: 0; background: var(--bestanden); transition: width .2s; }
  /* Der unbelegte Fall bekommt KEINEN Balken, sondern einen wandernden Strich: Er zeigt,
     dass etwas lebt, und behauptet nichts darueber, wie weit es ist. */
  .puls { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
          background: var(--ungemessen); animation: pulsen 1.2s ease-in-out infinite; }
  @keyframes pulsen { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

  /* DIE ZEICHENFLAECHE. Bild und Tafel liegen exakt uebereinander — die Tafel ist
     durchsichtig, und was darauf entsteht, gehoert zum Bild darunter.
     `touch-action: none` ist keine Kosmetik: Ohne das schiebt ein Tablet beim Zeichnen
     die Seite, statt einen Strich zu machen. */
  .zeichenflaeche { position: relative; margin: 10px 0; border: 1px solid var(--rand);
                    border-radius: 6px; overflow: hidden; background: #0e1013;
                    max-width: 900px; }
  .zeichenflaeche img { display: block; width: 100%; height: auto; }
  .zeichenflaeche canvas { position: absolute; inset: 0; width: 100%; height: 100%;
                           touch-action: none; cursor: crosshair; }
  /* DER GRUNDRISS. Er zeigt das Bauwerk von oben — und nur das Bauwerk: Die Szenenbox
     enthaelt das Gelaende, und ein Grundriss, in dem das Haus ein Fleck in einer Wiese
     ist, laedt zu einem Standpunkt ein, der daran vorbeisieht. */
  #riss { display: block; width: 100%; max-width: 760px; height: auto; margin: 10px 0;
          border: 1px solid var(--rand); border-radius: 6px; background: #0e1013;
          cursor: crosshair; touch-action: none; }
  .skizze { border: 1px solid var(--rand); border-radius: 6px; padding: 8px 12px;
            margin-top: 8px; font-size: 13px; }
  .skizze .stand { font-size: 12px; font-weight: 600; letter-spacing: .03em;
                   color: var(--ungemessen); }
  select { font: inherit; background: var(--grund); color: var(--schrift);
           border: 1px solid var(--rand); border-radius: 6px; padding: 6px 8px; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
  dt { color: var(--leise); }
  dd { margin: 0; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header>
  <h1>Visbox</h1>
  <input id="ordner" placeholder="Projektordner" size="34">
  <button id="laden">Öffnen</button>
  <button id="rechnen">Rechnen</button>
  <span id="stand" class="leise"></span>
</header>

<main>
  <section>
    <h2>Modell</h2>
    <div id="modell" class="leise">Noch kein Projekt geöffnet.</div>
  </section>

  <section>
    <h2>Was gerechnet würde</h2>
    <div id="baum" class="leise">—</div>
    <div id="lauf" hidden>
      <div class="laufzeile">
        <span id="laufknoten" class="art"></span>
        <span id="laufzeichen" class="zeichen"></span>
      </div>
      <div class="balkenrahmen" id="balkenrahmen" hidden><div id="balken"></div></div>
      <div id="laufsatz" class="satz"></div>
      <div id="lauffertige" class="satz"></div>
    </div>
  </section>

  <section style="grid-column: 1 / -1">
    <h2>Standpunkt</h2>
    <div id="rissgrund" class="meldung">Noch kein Projekt geöffnet.</div>
    <div id="rissblock" hidden>
      <div class="knopfzeile">
        <button id="risszurueck" type="button">Zurücksetzen</button>
        <label class="leise" for="augenhoeheRiss">Augenhöhe</label>
        <input id="augenhoeheRiss" type="number" step="0.5" value="1.6" style="width:5.5em">
        <span class="leise">m</span>
        <button id="rissuebernehmen" type="button">Standpunkt übernehmen</button>
      </div>
      <canvas id="riss" width="760" height="420"></canvas>
      <div id="risssatz" class="satz"></div>
    </div>
  </section>

  <section style="grid-column: 1 / -1">
    <h2>Skizze — Entwurfsmodus</h2>
    <div id="skizzenlage" class="meldung">
      Gezeichnet wird auf ein vorhandenes Bild. Öffnen Sie zuerst ein Projekt.
    </div>
    <div id="skizzenblock" hidden>
      <div class="knopfzeile">
        <label class="leise" for="unterlage">Unterlage</label>
        <select id="unterlage"></select>
        <label class="leise" for="stift">Strich</label>
        <input id="stift" type="range" min="1" max="24" value="6">
        <button id="radierer" type="button">Radierer: aus</button>
        <button id="leeren" type="button">Leeren</button>
        <button id="skizzeAblegen" type="button">In die Mappe legen</button>
      </div>
      <div class="zeichenflaeche">
        <img id="unterlagenbild" alt="">
        <canvas id="tafel"></canvas>
      </div>
      <div id="stiftlage" class="satz">Noch kein Strich gezeichnet.</div>
      <div id="skizzen" class="leise">—</div>
    </div>
  </section>

  <section style="grid-column: 1 / -1">
    <h2>Bilder</h2>
    <div id="bilder" class="leise">—</div>
  </section>
</main>

<script>
"use strict";

// KEIN RAHMENWERK. Die Flaeche zeigt vier Dinge an; dafuer eines einzubinden hiesse, eine
// Abhaengigkeit zu pflegen, zu installieren und lizenzzupruefen — fuer Code, der hier in
// hundert Zeilen steht.

const $ = (id) => document.getElementById(id);

/** Text einsetzen, niemals HTML. Ein Dateiname kommt von der Platte eines Menschen und
 *  ist damit fremder Text; ihn als HTML zu setzen hiesse, ihm zu erlauben, diese Seite
 *  umzubauen. */
function feld(tag, klasse, text) {
  const e = document.createElement(tag);
  if (klasse) e.className = klasse;
  if (text !== undefined && text !== null) e.textContent = String(text);
  return e;
}

function liste(paare) {
  const dl = feld("dl");
  for (const [k, v] of paare) {
    if (v === undefined || v === null || v === "") continue;
    dl.append(feld("dt", null, k), feld("dd", null, v));
  }
  return dl;
}

/** DIE DREI ZEICHEN. Hier steht keine Bedingung darueber, OB etwas gemessen wurde —
 *  das hat der Server aus der Bibliothek geholt. Hier wird nur angezeigt. */
function zeichenFuer(bild) {
  const beschriftung = {
    "bestanden": "bestanden",
    "durchgefallen": "durchgefallen",
    "nicht-gemessen": "nicht gemessen",
  }[bild.zeichen] || bild.zeichen;
  return feld("span", "zeichen " + bild.zeichen, beschriftung);
}

function zeigeModell(d) {
  const ziel = $("modell");
  ziel.replaceChildren();
  ziel.className = "";
  ziel.append(liste([
    ["Projekt", d.name],
    ["Datei", d.modell.pfad],
    ["Format", d.modell.einlass.format || d["import"].format],
    ["Weg herein", d["import"].weg],
    ["Hochachse", d["import"].hochachse_steht_fest
       ? d["import"].hochachse
       : (d.einstellungen.up_axis ? d.einstellungen.up_axis + " (angegeben)" : "nicht bekannt")],
  ]));

  // DER ZUSTAND DES MODELLS steht als Satz da und nicht als Farbe. Ein geaendertes
  // Modell haelt hier nichts an — es wird gemeldet, wie in der Bibliothek auch.
  if (d.modell.stand !== "unveraendert") {
    ziel.append(feld("div", "meldung", d.modell.grund));
  }
  // Was beim Import NICHT geprueft wurde, gehoert hierher und nicht in eine Fussnote.
  if (d["import"].treue === null || d["import"].treue === undefined) {
    ziel.append(feld("div", "satz",
      "Ob die Umwandlung die Geometrie getroffen hat, ist NICHT GEPRÜFT — dafür müsste " +
      "bekannt sein, was herauskommen soll."));
  }
  for (const h of (d["import"].hinweise || [])) ziel.append(feld("div", "satz", h));
}

/** Ein Eingabefeld zu einem Bedienfeld der Bibliothek.
 *
 *  DIE FELDER WERDEN NICHT HIER AUFGEZAEHLT. Sie kommen aus `baue_kette`, und die
 *  Zuordnung zum Knoten ist am gebauten Graphen abgelesen. Eine Liste an dieser Stelle
 *  waere in dem Augenblick veraltet, in dem die Bibliothek etwas dazubekommt — und genau
 *  so ist die Luecke entstanden, in der elf Bestellungen nicht erreichbar waren.
 */
function eingabe(f) {
  const e = feld("input");
  e.dataset.name = f.name;
  e.value = f.gesetzt ? alsText(f.wert) : "";
  e.placeholder = f.vorgabe === null || f.vorgabe === undefined
    ? "nicht gesetzt" : alsText(f.vorgabe);
  if (f.gesetzt) e.classList.add("gesetzt");
  e.addEventListener("input", () => e.classList.toggle("gesetzt", e.value.trim() !== ""));
  return e;
}

function alsText(w) {
  if (w === null || w === undefined) return "";
  return (typeof w === "object") ? JSON.stringify(w) : String(w);
}

/** Aus dem Eingabefeld wieder ein Wert.
 *
 *  LEER HEISST NICHT GESETZT, nicht «leerer Text»: Der Server entfernt das Feld dann, und
 *  es gilt wieder die Vorgabe der Bibliothek. Ein leerer Text waere etwas anderes — eine
 *  ausdrueckliche Angabe von nichts.
 */
function ausText(roh) {
  const s = roh.trim();
  if (s === "") return null;
  if (s === "true") return true;
  if (s === "false") return false;
  if (s !== "" && !isNaN(Number(s))) return Number(s);
  if (s.startsWith("{") || s.startsWith("[")) {
    try { return JSON.parse(s); } catch (f) { return s; }
  }
  return s;
}

function zeigeBaum(d) {
  const ziel = $("baum");
  ziel.replaceChildren();
  ziel.className = "";
  if (d.knotenbaum_fehler) {
    ziel.append(feld("div", "meldung fehler", d.knotenbaum_fehler));
  }
  if (!d.knotenbaum.length && !d.knotenbaum_fehler) {
    ziel.className = "leise";
    ziel.textContent = "Keine Rechnung möglich — es fehlt die umgewandelte Geometrie.";
    return;
  }

  const felderJeKnoten = new Map();
  const ohneKnoten = [];
  for (const f of (d.bedienfelder || [])) {
    if (f.knoten) {
      if (!felderJeKnoten.has(f.knoten)) felderJeKnoten.set(f.knoten, []);
      felderJeKnoten.get(f.knoten).push(f);
    } else {
      ohneKnoten.push(f);
    }
  }

  for (const k of d.knotenbaum) {
    const block = feld("div", "knoten");
    const zeile = feld("div", "zeile");
    zeile.append(feld("span", "art", k.art));
    zeile.append(feld("span", "von",
      k.eingaenge.length ? "aus " + k.eingaenge.join(", ") : "Anfang"));
    const eigene = felderJeKnoten.get(k.id) || [];
    zeile.append(feld("span", "von", eigene.length ? eigene.length + " Einstellungen" : ""));
    block.append(zeile);

    const felder = feld("div", "felder");
    felder.hidden = true;
    for (const f of eigene) {
      felder.append(feld("label", null, f.name));
      felder.append(eingabe(f));
    }
    if (eigene.length) {
      zeile.addEventListener("click", () => { felder.hidden = !felder.hidden; });
      block.append(felder);
    }
    ziel.append(block);
  }

  if (ohneKnoten.length) {
    const block = feld("div", "knoten");
    // DREI ANTWORTEN, DREI SAETZE. «Kein Knoten» hiess dreierlei, und die drei sahen
    // gleich aus — genau die Verwechslung, gegen die diese Flaeche sonst ueberall steht.
    const bau = ohneKnoten.filter((f) => f.wirkt_auf === "bau").length;
    block.append(feld("div", "satz", bau === ohneKnoten.length
      ? "Diese Angaben bestimmen, WELCHE Knoten es gibt — nicht den Inhalt eines einzelnen:"
      : "Diese Angaben gehören zu keinem einzelnen Knoten. Bei den mit «?» markierten " +
        "hat die Prüfung nicht feststellen können, wo sie wirken:"));
    const felder = feld("div", "felder");
    for (const f of ohneKnoten) {
      felder.append(feld("label", null,
        f.wirkt_auf === "unbekannt" ? f.name + " ?" : f.name));
      felder.append(eingabe(f));
    }
    block.append(felder);
    ziel.append(block);
  }

  const zeile = feld("div", "knopfzeile");
  const knopf = feld("button", null, "Einstellungen übernehmen");
  knopf.addEventListener("click", uebernehmen);
  zeile.append(knopf);
  zeile.append(feld("span", "satz",
    "Leer lassen heisst: es gilt die Vorgabe des Programms."));
  ziel.append(zeile);
}

/** Alle Felder einsammeln und der Bibliothek vorlegen.
 *
 *  GEPRUEFT WIRD NICHT HIER. Der Server baut die Kette mit den neuen Werten; baut sie
 *  nicht, kommt der Satz der Bibliothek zurueck und es wird NICHTS gespeichert. Eine
 *  Flaeche mit eigenen Regeln ueber zulaessige Werte haette dieselbe Regel zweimal.
 */
async function uebernehmen() {
  const werte = {};
  for (const e of document.querySelectorAll(".felder input")) {
    werte[e.dataset.name] = ausText(e.value);
  }
  await einstellungenSchicken(werte);
}

/** Einstellungen an die Bibliothek geben. Getrennt von `uebernehmen`, damit auch der
 *  Grundriss denselben Weg nimmt — *zwei Wege, dieselbe Sache, und einer davon
 *  veraltet.* */
async function einstellungenSchicken(werte) {
  $("stand").textContent = "übernimmt …";
  try {
    const antwort = await fetch("/api/einstellungen", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ordner: $("ordner").value.trim(), einstellungen: werte}),
    });
    const d = await antwort.json();
    if (d.fehler) { $("stand").textContent = d.fehler; return; }
    await laden();
    $("stand").textContent = "Einstellungen übernommen.";
  } catch (f) {
    $("stand").textContent = "Die Änderung liess sich nicht speichern: " + f;
  }
}

/** Der Weg, unter dem der Server ein Bild dieses Projekts ausliefert.
 *  Beide Teile werden kodiert: Ein Dateiname darf ein `&` enthalten, und ohne Kodierung
 *  waere ab dort ein zweiter Parameter daraus geworden. */
function bildweg(ordner, name) {
  return "/bild?ordner=" + encodeURIComponent(ordner) + "&name=" + encodeURIComponent(name);
}

/** Ein Bild mit seinem Abzeichen AUF dem Bild — oder die Luecke, wenn die Datei weg ist.
 *
 *  Hier wird nichts entschieden: `zeichen`, `satz` und `vorhanden` kommen fertig vom
 *  Server, der sie aus der Bibliothek hat. Diese Funktion setzt sie nur hin. */
function bildrahmen(ordner, b) {
  const rahmen = feld("div", "rahmen " + b.zeichen);

  if (b.vorhanden === false) {
    rahmen.append(feld("div", "fehlt",
      "Die Datei gibt es nicht (mehr). Das Projekt nennt sie weiter — " +
      "hier wird nichts hinter Ihrem Rücken gelöscht."));
  } else if (b.vorhanden === null) {
    // UNBEKANNT, nicht «weg». Die Frage wurde nicht gestellt.
    rahmen.append(feld("div", "fehlt", "Ob die Datei da ist, wurde nicht geprüft."));
  } else {
    const bild = feld("img");
    bild.src = bildweg(ordner, b.bild);
    bild.alt = b.bild;
    bild.loading = "lazy";
    // UND WENN DAS LADEN SCHEITERT, bleibt kein leerer Rahmen stehen. Ein leerer Rahmen
    // mit gruenem Abzeichen waere genau die Beruhigung, gegen die dieses Feld gebaut ist.
    bild.onerror = () => {
      bild.remove();
      rahmen.prepend(feld("div", "fehlt", "Das Bild liess sich nicht laden."));
    };
    rahmen.append(bild);
  }

  // DIE AUFLAGE STEHT IMMER DA, auch am bestandenen Bild und auch an der Luecke.
  // Kein Abzeichen sieht aus wie kein Problem.
  rahmen.append(feld("div", "auflage", zeichenwort(b) + " · " + b.satz));
  return rahmen;
}

function zeichenwort(b) {
  return {
    "bestanden": "GEPRÜFT",
    "durchgefallen": "DURCHGEFALLEN",
    "nicht-gemessen": "NICHT GEPRÜFT",
  }[b.zeichen] || b.zeichen;
}

/** Das Bild und seine Unterlage nebeneinander — wenn es eine gibt.
 *
 *  Die Unterlage ist der Geometrielayer (E20): das Bild, auf dem dieses hier aufsetzt.
 *  Ihr Urteil steht unter `basis` und NIE im selben Feld wie das eigene. */
function nebeneinander(ordner, b, alleBilder) {
  const unterlage = b.basis && b.basis.bild
    ? alleBilder.find((x) => x.bild === b.basis.bild) : null;
  if (!unterlage) return bildrahmen(ordner, b);

  const paar = feld("div", "paar");
  for (const [titel, eintrag] of [["Unterlage", unterlage], ["Dieses Bild", b]]) {
    const spalte = feld("div");
    spalte.append(feld("div", "titel", titel));
    spalte.append(bildrahmen(ordner, eintrag));
    paar.append(spalte);
  }
  return paar;
}

function zeigeBilder(d) {
  const ziel = $("bilder");
  ziel.replaceChildren();
  ziel.className = d.bilder.length ? "" : "leise";
  if (!d.bilder.length) { ziel.textContent = "Noch keine Bilder in diesem Projekt."; return; }

  for (const b of d.bilder) {
    const karte = feld("div", "bild");
    const kopf = feld("div", "kopf");
    kopf.append(zeichenFuer(b));
    kopf.append(feld("span", "name", b.bild));
    kopf.append(feld("span", "leise", b.schicht));
    karte.append(kopf);
    // DER SATZ STEHT IMMER DA, auch beim bestandenen Bild. Eine Zahl ohne ihre Bedingung
    // ist keine Auskunft — und ein Abzeichen ohne Satz ist eine Zahl ohne Bedingung.
    karte.append(feld("div", "satz", b.satz));

    // UND JETZT DAS BILD SELBST. Bis zum 21.09.2026 nannte diese Flaeche nur Dateinamen
    // und Urteile — ein Werkzeug fuer Bilder, das keine Bilder zeigt.
    karte.append(nebeneinander(d.ordner, b, d.bilder));

    if (b.basis) {
      const u = b.basis.geometrie_bestanden;
      const wort = u === true ? "bestanden" : (u === false ? "durchgefallen" : "nicht gemessen");
      const block = feld("div", "basis");
      block.append(feld("div", null,
        "Darunter liegt " + (b.basis.bild || "ein Bild") + " — dessen Geometrie ist " +
        wort + "."));
      if (b.basis.grund) block.append(feld("div", "satz", b.basis.grund));
      if (b.basis.herkunft) block.append(feld("div", "satz", "Zuordnung: " + b.basis.herkunft));
      karte.append(block);
    }

    const h = b.herkunft || {};
    karte.append(liste([
      ["Prompt", h.prompt], ["Backbone", h.backbone], ["Startwert", h.seed],
      ["Modellstand", h.modell_stand !== "unveraendert" ? h.modell_stand : null],
    ]));
    ziel.append(karte);
  }
}

async function laden() {
  const ordner = $("ordner").value.trim();
  $("stand").textContent = "lädt …";
  try {
    const antwort = await fetch("/api/projekt?ordner=" + encodeURIComponent(ordner));
    const d = await antwort.json();
    if (d.fehler) { $("stand").textContent = d.fehler; return; }
    zeigeModell(d); zeigeBaum(d); zeigeBilder(d); zeigeSkizzenteil(d); zeigeGrundriss(d);
    $("stand").textContent = d.bilder.length + " Bilder, " + d.laeufe.length + " Läufe";
  } catch (f) {
    $("stand").textContent = "Die Oberfläche erreicht ihren eigenen Dienst nicht: " + f;
  }
}

// ══════════════════════════════════════════════════════════════════════════════════
// Der Lauf und das Zusehen
//
// ZWEI SORTEN LEBENSZEICHEN, und sie duerfen nie gleich aussehen:
//
//   belegt    — gezaehlte Diffusionsschritte. Es steht fest, wie viele es werden, und
//               jeder einzelne wurde wirklich gerechnet. Hier ist ein Balken ehrlich.
//   unbelegt  — ein Knoten laeuft. Ein Blender-Lauf meldet ein LEBENSzeichen und keinen
//               Fortschritt; wie weit er ist, weiss niemand. Hier gibt es einen Puls
//               und eine Dauer, und ausdruecklich keinen Balken.
//
// *Ein erfundener Balken ist dasselbe wie ein gruenes Abzeichen an einem ungepruefeten
// Bild: Er sieht aus wie eine Auskunft und ist geraten.*
// ══════════════════════════════════════════════════════════════════════════════════

let laufUhr = null;

function zeigeLauf(f) {
  const block = $("lauf");
  block.hidden = !f.laeuft && !f.fehler && !f.ergebnis;
  if (block.hidden) return;

  $("laufknoten").textContent = f.laeuft
    ? `${f.knotenart || "…"}  (${f.nummer || "?"} von ${f.von || "?"})`
    : "fertig";

  const zeichen = $("laufzeichen");
  zeichen.replaceChildren();
  zeichen.className = "zeichen";

  const belegt = f.art_des_zeichens === "belegt";
  $("balkenrahmen").hidden = !(f.laeuft && belegt);

  if (!f.laeuft) {
    $("laufsatz").textContent = f.fehler
      ? f.fehler
      : (f.ergebnis ? `${f.ergebnis.vermerkt} Bilder eingetragen` +
                      (f.ergebnis.error ? " — " + f.ergebnis.error : "") : "");
    zeichen.classList.add(f.fehler ? "durchgefallen" : "bestanden");
    zeichen.textContent = f.fehler ? "fehlgeschlagen" : "fertig";
    return;
  }

  if (belegt) {
    const anteil = Math.min(1, f.schritt / f.schritte_gesamt);
    $("balken").style.width = (anteil * 100).toFixed(1) + "%";
    zeichen.classList.add("bestanden");
    zeichen.textContent = "gezählt";
    $("laufsatz").textContent =
      `Schritt ${f.schritt} von ${f.schritte_gesamt} — wirklich gerechnete Schritte.`;
  } else {
    // KEIN BALKEN. Der Puls sagt: es lebt. Er sagt nicht, wie weit es ist.
    zeichen.classList.add("nicht-gemessen");
    zeichen.append(feld("span", "puls"), document.createTextNode(" läuft"));
    $("laufsatz").textContent =
      `Seit ${f.knoten_seit_s ?? "?"} s an diesem Schritt, ${f.seit_s ?? "?"} s insgesamt. ` +
      `WIE WEIT er ist, meldet dieser Knoten nicht — das ist ein Lebenszeichen und kein Fortschritt.`;
  }

  const fertige = (f.fertige || []).map((k) =>
    `${k.knotenart}${k.aus_cache ? " (aus dem Speicher)" : ""}`);
  $("lauffertige").textContent = fertige.length ? "Erledigt: " + fertige.join(", ") : "";
}

async function fortschrittHolen() {
  try {
    const f = await (await fetch("/api/fortschritt")).json();
    zeigeLauf(f);

    // LAEUFT EINER UND NIEMAND SIEHT HIN, wird hingesehen. Der Lauf haengt am Server und
    // nicht am Fenster: Wer die Seite neu laedt, soll nicht denken, sein Lauf sei weg.
    if (f.laeuft && !laufUhr) laufUhr = setInterval(fortschrittHolen, 1000);

    if (!f.laeuft && laufUhr) {
      clearInterval(laufUhr);
      laufUhr = null;
      $("stand").textContent = f.fehler ? f.fehler : "Lauf beendet.";
      await laden();
    }
  } catch (fehler) {
    if (laufUhr) { clearInterval(laufUhr); laufUhr = null; }
    $("stand").textContent = "Der Fortschritt liess sich nicht abfragen: " + fehler;
  }
}

async function rechnen() {
  $("stand").textContent = "startet …";
  try {
    const antwort = await fetch("/api/rechne", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ordner: $("ordner").value.trim()}),
    });
    const d = await antwort.json();
    // EIN FEHLSCHLAG WIRD ANGEZEIGT, NICHT VERSCHLUCKT. Er ist ein Satz aus der
    // Bibliothek und fuer einen Menschen geschrieben.
    if (d.fehler) { $("stand").textContent = d.fehler; return; }

    $("stand").textContent = "rechnet …";
    // EINE SEKUNDE, und die Uhr stellt `fortschrittHolen` selbst. Haeufiger waere eine
    // Anfrage je Bildschirmaufbau fuer eine Zahl, die sich alle paar Sekunden aendert;
    // seltener saehe nach Stillstand aus.
    fortschrittHolen();
  } catch (f) {
    $("stand").textContent = "Der Lauf liess sich nicht starten: " + f;
  }
}

// ══════════════════════════════════════════════════════════════════════════════════
// Der Grundriss — den Standpunkt anklicken statt eintippen
//
// Bis zum 21.09.2026 waren `auge` und `blick_auf` ueber diese Flaeche nur als drei
// getippte Zahlen erreichbar. *Was nur ueber das Eintippen von Koordinaten erreichbar
// ist, wird nicht benutzt.*
//
// Gezeichnet wird die Huellbox des BAUWERKS von oben. Weltkoordinaten mit Z oben: Der
// Grundriss ist die X/Y-Ebene, die Hoehe ist Z.
// ══════════════════════════════════════════════════════════════════════════════════

const riss = { bbox: null, auge: null, ziel: null, rand: 0.35 };

/** Weltkoordinate → Bildpunkt auf der Rissflaeche.
 *
 *  Massstabsgetreu und mit GLEICHEM Massstab in beiden Richtungen: Ein Grundriss, der
 *  X anders skaliert als Y, zeigt ein Haus, das es nicht gibt — und ein Standpunkt
 *  daraus staende anderswo als geklickt. */
function rissAbbildung() {
  const c = $("riss"), b = riss.bbox;
  const breite = b[1][0] - b[0][0], tiefe = b[1][1] - b[0][1];
  const spanne = Math.max(breite, tiefe) * (1 + 2 * riss.rand) || 1;
  const massstab = Math.min(c.width, c.height) / spanne;
  const mx = (b[0][0] + b[1][0]) / 2, my = (b[0][1] + b[1][1]) / 2;
  return {
    hin: (x, y) => [c.width / 2 + (x - mx) * massstab,
                    // Y NACH OBEN, wie auf einem Plan. Auf einer Leinwand waechst y nach
                    // unten; ohne dieses Minus staende Norden unten.
                    c.height / 2 - (y - my) * massstab],
    zurueck: (px, py) => [mx + (px - c.width / 2) / massstab,
                          my - (py - c.height / 2) / massstab],
    massstab,
  };
}

function zeichneRiss() {
  const c = $("riss"), g = c.getContext("2d"), b = riss.bbox;
  g.clearRect(0, 0, c.width, c.height);
  if (!b) return;
  const a = rissAbbildung();

  // Das Bauwerk
  const [x0, y0] = a.hin(b[0][0], b[0][1]);
  const [x1, y1] = a.hin(b[1][0], b[1][1]);
  g.fillStyle = "rgba(230,232,236,.12)";
  g.strokeStyle = "#9aa2ae";
  g.lineWidth = 1.5;
  g.fillRect(Math.min(x0, x1), Math.min(y0, y1), Math.abs(x1 - x0), Math.abs(y1 - y0));
  g.strokeRect(Math.min(x0, x1), Math.min(y0, y1), Math.abs(x1 - x0), Math.abs(y1 - y0));

  // Norden, damit die Richtung nicht geraten werden muss
  g.fillStyle = "#9aa2ae";
  g.font = "12px system-ui, sans-serif";
  g.fillText("N ↑", 10, 20);

  if (riss.auge && riss.ziel) {
    const [ax, ay] = a.hin(riss.auge[0], riss.auge[1]);
    const [zx, zy] = a.hin(riss.ziel[0], riss.ziel[1]);
    g.strokeStyle = "#4ea373";
    g.setLineDash([5, 4]);
    g.beginPath(); g.moveTo(ax, ay); g.lineTo(zx, zy); g.stroke();
    g.setLineDash([]);
  }
  for (const [punkt, farbe, wort] of [[riss.auge, "#4ea373", "Standpunkt"],
                                      [riss.ziel, "#c8a53f", "Blickziel"]]) {
    if (!punkt) continue;
    const [px, py] = a.hin(punkt[0], punkt[1]);
    g.fillStyle = farbe;
    g.beginPath(); g.arc(px, py, 6, 0, Math.PI * 2); g.fill();
    g.fillText(wort, px + 10, py + 4);
  }
}

function rissKlick(e) {
  if (!riss.bbox) return;
  const c = $("riss"), r = c.getBoundingClientRect();
  const a = rissAbbildung();
  const [x, y] = a.zurueck((e.clientX - r.left) * (c.width / r.width),
                           (e.clientY - r.top) * (c.height / r.height));
  // ERSTER KLICK: wo man steht. ZWEITER: wohin man sieht. Danach faengt es von vorn an —
  // eine Reihenfolge, die man sich merken muss, ist eine Bedienungsanleitung.
  if (!riss.auge || (riss.auge && riss.ziel)) { riss.auge = [x, y]; riss.ziel = null; }
  else { riss.ziel = [x, y]; }
  zeichneRiss();
  zeigeRisssatz();
}

function zeigeRisssatz() {
  if (!riss.auge) {
    $("risssatz").textContent = "Klicken Sie, wo Sie stehen. Dann, wohin Sie sehen.";
    return;
  }
  if (!riss.ziel) {
    $("risssatz").textContent = "Standpunkt gesetzt. Jetzt klicken, wohin Sie sehen.";
    return;
  }
  const dx = riss.ziel[0] - riss.auge[0], dy = riss.ziel[1] - riss.auge[1];
  const weite = Math.hypot(dx, dy);
  $("risssatz").textContent =
    `Abstand ${weite.toFixed(1)} m. Übernehmen schreibt 'auge' und 'blick_auf' in die ` +
    `Einstellungen — die Höhe des Standpunkts kommt aus der Augenhöhe über der ` +
    `Unterkante des Bauwerks.`;
}

function zeigeGrundriss(d) {
  const g = d.grundriss || {};
  riss.bbox = g.bbox || null;
  riss.auge = null;
  riss.ziel = null;
  $("rissblock").hidden = !riss.bbox;
  $("rissgrund").hidden = !!riss.bbox;
  if (!riss.bbox) {
    $("rissgrund").textContent = g.grund ||
      "Für dieses Projekt lässt sich kein Grundriss zeichnen.";
    return;
  }
  // DER VORBEHALT DER BIBLIOTHEK WANDERT MIT, auch wenn eine Box da ist.
  $("risssatz").textContent = "";
  if (g.grund) $("risssatz").textContent = g.grund;
  zeichneRiss();
  zeigeRisssatz();
}

async function rissUebernehmen() {
  if (!riss.auge || !riss.ziel) {
    $("stand").textContent = "Erst Standpunkt und Blickziel anklicken.";
    return;
  }
  const hoehe = Number($("augenhoeheRiss").value) || 1.6;
  const unterkante = riss.bbox[0][2];
  // DIE HOEHE DES ZIELS ist die halbe Bauwerkshoehe — nicht der Boden. Wer auf den Boden
  // zielt, bekommt ein Bild, in dem das Haus nach hinten kippt.
  const mitte = (riss.bbox[0][2] + riss.bbox[1][2]) / 2;
  const neu = {
    auge: [riss.auge[0], riss.auge[1], unterkante + hoehe],
    blick_auf: [riss.ziel[0], riss.ziel[1], mitte],
  };
  await einstellungenSchicken(neu);
}

// ══════════════════════════════════════════════════════════════════════════════════
// Die Zeichenflaeche — der Entwurfsmodus (E23)
//
// SIE IST FUER EINEN STIFT GEBAUT, nicht fuer eine Maus, die auch geht. Das ist der
// Unterschied, um den es hier geht: Ein iPad mit Stift soll sich anfuehlen wie eine
// Zeichen-App, und dafuer muessen Druck und Stiftart wirklich ankommen.
//
// `PointerEvent` ist der einzige Weg, der beides liefert und ueberall gleich heisst —
// `pointerType` ("pen" / "touch" / "mouse") und `pressure` (0 bis 1). Maus- und
// Beruehrungsereignisse getrennt zu behandeln waere derselbe Code dreimal.
// ══════════════════════════════════════════════════════════════════════════════════

/** Wie breit ein Strich bei diesem Druck wird.
 *
 *  KEINE Kurve und keine Glaettung — noch nicht. Was ein Stift auf einem echten Geraet
 *  wirklich meldet, hat hier niemand gemessen; eine erfundene Druckkurve saehe nach
 *  Handwerk aus und waere geraten.
 *
 *  `pressure` ist 0, wenn das Geraet keinen Druck kennt (Maus, einfacher Finger). Dann
 *  gilt die eingestellte Breite unveraendert — sonst zoege eine Maus Haarlinien. */
function strichbreite(grund, druck, art) {
  if (art !== "pen" || !druck) return grund;
  return Math.max(1, grund * (0.25 + 1.5 * druck));
}

const tafel = {
  stift: null, letzte: null, gezeichnet: false, radiert: false,
  /** Was das Geraet bisher wirklich gemeldet hat — fuer die Zeile unter der Flaeche.
   *  Das ist die einzige Messung, die diese Seite selbst vornimmt, und sie misst das
   *  GERAET, nicht die Zeichnung: Ohne sie weiss niemand, ob der Stift ankommt. */
  arten: new Set(), druckMax: 0,
};

function tafelGroesse() {
  const leinwand = $("tafel"), bild = $("unterlagenbild");
  // DIE TAFEL BEKOMMT DIE PUNKTZAHL DES BILDES, nicht die des Bildschirms. Eine Skizze,
  // die in Bildschirmpunkten entsteht, passt spaeter nicht auf das Bild, auf das sie
  // gezeichnet wurde — und genau darauf soll sie ja angewandt werden.
  if (!bild.naturalWidth) return;
  leinwand.width = bild.naturalWidth;
  leinwand.height = bild.naturalHeight;
}

/** Bildschirmpunkt → Bildpunkt. Ohne diese Umrechnung sitzt der Strich dort, wo geklickt
 *  wurde, und nicht dort, wo das Bild getroffen wurde. */
function aufTafel(e) {
  const leinwand = $("tafel"), r = leinwand.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (leinwand.width / r.width),
    y: (e.clientY - r.top) * (leinwand.height / r.height),
  };
}

function zeichenStart(e) {
  if (!$("tafel").width) return;
  tafel.stift = e.pointerId;
  tafel.letzte = aufTafel(e);
  tafel.arten.add(e.pointerType || "unbekannt");
  if (e.pointerType === "pen") tafel.druckMax = Math.max(tafel.druckMax, e.pressure || 0);
  $("tafel").setPointerCapture(e.pointerId);
  e.preventDefault();
}

function zeichenZug(e) {
  if (tafel.stift !== e.pointerId) return;
  const c = $("tafel").getContext("2d");
  const jetzt = aufTafel(e);
  const breite = strichbreite(Number($("stift").value), e.pressure, e.pointerType);

  if (e.pointerType === "pen") tafel.druckMax = Math.max(tafel.druckMax, e.pressure || 0);

  // RADIEREN IST KEIN WEISSER STRICH, sondern Wegnehmen. Ein weisser Strich auf einer
  // durchsichtigen Tafel waere weisse Farbe — und wuerde das Bild darunter verdecken
  // statt die eigene Linie zu entfernen.
  c.globalCompositeOperation = tafel.radiert ? "destination-out" : "source-over";
  c.strokeStyle = "#ff3b30";
  c.lineWidth = tafel.radiert ? breite * 2.5 : breite;
  c.lineCap = "round";
  c.lineJoin = "round";
  c.beginPath();
  c.moveTo(tafel.letzte.x, tafel.letzte.y);
  c.lineTo(jetzt.x, jetzt.y);
  c.stroke();

  tafel.letzte = jetzt;
  tafel.gezeichnet = true;
  zeigeStiftlage();
  e.preventDefault();
}

function zeichenEnde(e) {
  if (tafel.stift !== e.pointerId) return;
  tafel.stift = null;
  tafel.letzte = null;
}

/** Was das Geraet gemeldet hat — und was NICHT.
 *
 *  Auf einem iPad soll hier "pen" stehen und ein Druck ueber null. Steht dort "touch",
 *  hat der Stift nichts geliefert, was diese Seite von einem Finger unterscheiden
 *  koennte. *Eine Zeichenflaeche, die nicht sagt, ob der Stift ankommt, laesst den
 *  Benutzer raten, warum der Strich ueberall gleich dick ist.* */
function zeigeStiftlage() {
  if (!tafel.gezeichnet) { $("stiftlage").textContent = "Noch kein Strich gezeichnet."; return; }
  const arten = [...tafel.arten].join(", ");
  $("stiftlage").textContent = tafel.druckMax > 0
    ? `Eingabe: ${arten} · Druck kommt an (bis ${tafel.druckMax.toFixed(2)})`
    : `Eingabe: ${arten} · KEIN Druck gemeldet — der Strich hat überall dieselbe Breite.`;
}

function tafelLeeren() {
  const c = $("tafel").getContext("2d");
  c.clearRect(0, 0, $("tafel").width, $("tafel").height);
  tafel.gezeichnet = false;
  zeigeStiftlage();
}

function zeigeSkizzenteil(d) {
  const hat = (d.bilder || []).filter((b) => b.vorhanden !== false);
  $("skizzenlage").hidden = hat.length > 0;
  $("skizzenblock").hidden = hat.length === 0;
  if (!hat.length) {
    $("skizzenlage").textContent =
      "Gezeichnet wird auf ein vorhandenes Bild — in diesem Projekt liegt noch keines.";
    return;
  }

  const wahl = $("unterlage");
  const vorher = wahl.value;
  wahl.replaceChildren();
  for (const b of hat) {
    const o = feld("option", null, b.bild);
    o.value = b.bild;
    wahl.append(o);
  }
  if (hat.some((b) => b.bild === vorher)) wahl.value = vorher;
  unterlageWechseln();

  const liste2 = $("skizzen");
  liste2.replaceChildren();
  const skizzen = d.skizzen || [];
  liste2.className = skizzen.length ? "" : "leise";
  if (!skizzen.length) { liste2.textContent = "Noch keine Skizze in diesem Projekt."; return; }
  for (const s of skizzen) {
    const k = feld("div", "skizze");
    k.append(feld("span", "stand", s.stand.toUpperCase()), feld("span", null, "  " + s.skizze));
    k.append(feld("div", "satz",
      (s.ueber ? "über " + s.ueber : "ohne Unterlage") + (s.bemerkung ? " · " + s.bemerkung : "")));
    liste2.append(k);
  }
}

function unterlageWechseln() {
  const name = $("unterlage").value;
  if (!name) return;
  $("unterlagenbild").src = bildweg($("ordner").value.trim(), name);
}

async function skizzeAblegen() {
  if (!tafel.gezeichnet) { $("stand").textContent = "Es ist nichts gezeichnet."; return; }
  const daten = $("tafel").toDataURL("image/png").split(",")[1];
  $("stand").textContent = "legt ab …";
  try {
    const antwort = await fetch("/api/skizze", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        ordner: $("ordner").value.trim(),
        ueber: $("unterlage").value,
        png_base64: daten,
      }),
    });
    const d = await antwort.json();
    // DER HINWEIS KOMMT VOM SERVER UND WIRD GEZEIGT. Er sagt, dass die Zeichnung
    // abgelegt und NICHT gerechnet wurde — eine Bestellung, die angenommen und nicht
    // ausgeliefert wird, ist schlimmer als eine abgelehnte.
    $("stand").textContent = d.fehler ? d.fehler : (d.skizze + " — " + d.hinweis);
    if (!d.fehler) { tafelLeeren(); await laden(); }
  } catch (f) {
    $("stand").textContent = "Die Zeichnung liess sich nicht ablegen: " + f;
  }
}

$("unterlagenbild").addEventListener("load", tafelGroesse);
$("unterlage").addEventListener("change", unterlageWechseln);
$("tafel").addEventListener("pointerdown", zeichenStart);
$("tafel").addEventListener("pointermove", zeichenZug);
$("tafel").addEventListener("pointerup", zeichenEnde);
$("tafel").addEventListener("pointercancel", zeichenEnde);
$("leeren").addEventListener("click", tafelLeeren);
$("skizzeAblegen").addEventListener("click", skizzeAblegen);
$("radierer").addEventListener("click", () => {
  tafel.radiert = !tafel.radiert;
  $("radierer").textContent = "Radierer: " + (tafel.radiert ? "an" : "aus");
});

$("riss").addEventListener("pointerdown", rissKlick);
$("risszurueck").addEventListener("click", () => {
  riss.auge = null; riss.ziel = null; zeichneRiss(); zeigeRisssatz();
});
$("rissuebernehmen").addEventListener("click", rissUebernehmen);

$("laden").addEventListener("click", laden);
$("rechnen").addEventListener("click", rechnen);
$("ordner").addEventListener("keydown", (e) => { if (e.key === "Enter") laden(); });
// Beim Start einmal fragen: Wer mit --ordner gestartet hat, soll nicht erst klicken.
laden();
// UND EINMAL NACHSEHEN, OB SCHON EINER LAEUFT — siehe `fortschrittHolen`.
fortschrittHolen();
</script>
</body>
</html>
